<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM</title>
    <!-- 라이브러리 및 폰트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.96); transition: 0.1s; }
        
        /* 테마별 색상 */
        .theme-전체 { --theme-color: #475569; }
        .theme-긴급 { --theme-color: #ef4444; }
        .theme-미연락 { --theme-color: #f59e0b; }
        .theme-상담진행 { --theme-color: #3b82f6; }
        .theme-사은품 { --theme-color: #10b981; }
        
        .tab-active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); font-weight: 900; }
        .tab-inactive { color: #94a3b8; border-bottom: 3px solid transparent; }

        /* 카드 UI 스타일 */
        .direct-select { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 99px; padding: 4px 10px; font-weight: 800; color: #475569; appearance: none; outline: none; cursor: pointer; text-align: center; }
        .product-select { font-size: 14px; border-color: #3b82f6; color: #3b82f6; min-width: 80px; }
        .category-direct-select { font-size: 11px; border-color: #cbd5e1; min-width: 80px; }

        .urgent-card { border: 2px solid #ef4444 !important; background-color: #fffafb !important; }
        .urgent-btn-active { background: #ef4444 !important; color: white !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* 메모 영역: 성함과 동일한 Pretendard 폰트 */
        .memo-container { background: #f9fafb; border-radius: 12px; border: 1px solid #f1f5f9; padding: 12px; }
        .inline-notes { 
            width: 100%; 
            background: transparent; 
            border: none; 
            outline: none; 
            resize: none; 
            font-weight: 600; 
            line-height: 1.5; 
            color: #334155; 
            font-size: 14px; 
            font-family: 'Pretendard', sans-serif;
        }
        
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 select-none theme-전체" id="mainBody">

        <div class="p-5 space-y-5 overflow-y-auto pb-60 no-scrollbar">
            <!-- AI OCR 엔진 -->

                    <span><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI 사진 분석 등록</span>

                <div class="grid grid-cols-2 gap-2">

                    <button onclick="smartParseAction()" class="bg-blue-600 text-white rounded-xl py-3.5 text-xs font-black shadow-lg">텍스트 추가</button>

                    <select id="formProduct" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm appearance-none bg-white">
                        <option value="미지정">미지정</option>
                        <option value="티비">티비</option>
                        <option value="냉장고">냉장고</option>
                        <option value="에어컨">에어컨</option>
                        <option value="혼수">혼수 가전</option>
                        <option value="인덕션">인덕션</option>
                        <option value="식기세척기">식세기</option>
                        <option value="김치냉장고">김냉</option>

                </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">

                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase font-bold">사진 첨부</label>
                    <button onclick="document.getElementById('photoInput').click()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-400 active-scale">파일 선택</button>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
            <button onclick="saveCustomer()" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black shadow-lg text-base active-scale uppercase tracking-wider">데이터 동기화 완료</button>
        </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="fixed inset-0 z-[260] bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs rounded-[32px] p-6 text-center shadow-2xl scale-in duration-200">
            <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-trash-can text-lg"></i>
            </div>
            <h3 class="text-base font-black text-slate-800 mb-2">데이터를 삭제할까요?</h3>

            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-2xl font-black text-xs">취소</button>
                <button id="confirmDeleteBtn" class="flex-1 py-3 bg-red-500 text-white rounded-2xl font-black text-xs active-scale">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ⚙️ 보안 및 채널 설정
        const masterPassword = "7604";
        const apiKey = ""; 
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'park-crm-v66-master-flow';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let db, auth;
        let customers = [];
        let editingId = null;
        let deletingId = null;
        let currentCategory = '전체';
        let currentImageData = "";

        const products = ['미지정', '티비', '냉장고', '에어컨', '혼수', '인덕션', '식기세척기', '김치냉장고'];
        const categories = ['미연락', '상담진행', '사은품'];

        // 1. 보안 체크
        window.checkPassword = function() {
            const input = document.getElementById('passwordInput').value;
            if (input === masterPassword) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('loading-screen').classList.remove('hidden');
                initApp();
            } else {
                const err = document.getElementById('password-error');
                err.classList.remove('hidden');
                document.getElementById('passwordInput').value = "";
                document.getElementById('passwordInput').focus();
            }
        };

        // 2. 파이베이스 연동
        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const timeout = setTimeout(() => { if (customers.length === 0) renderFallback(); }, 5000);

                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        clearTimeout(timeout);
                        const ref = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
                        onSnapshot(ref, (snapshot) => {
                            customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            if (customers.length === 0) seedInitialData();
                            render();
                            document.getElementById('loading-screen').classList.add('hidden');
                        }, (err) => renderFallback());
                    } else renderFallback();
                });
            } catch (e) { renderFallback(); }
        }

        async function seedInitialData() {
            const initialList = [
                { name: '박정권', phone: '010-9107-5798', category: '상담진행', isUrgent: false, product: '미지정', notes: '주요 고객님 결정 대기 중', updatedAt: new Date().toISOString() },
                { name: '에어컨 신규', phone: '010-2985-0955', category: '미연락', isUrgent: true, product: '에어컨', notes: '오늘 연락 필수!', updatedAt: new Date().toISOString() },
                { name: '조수진', phone: '010-4416-8488', category: '상담진행', isUrgent: false, product: '혼수', notes: '상담 진행 중', updatedAt: new Date().toISOString() },
                { name: '장성필', phone: '010-4553-6113', category: '상담진행', isUrgent: false, product: '냉장고', notes: '견적 요청 / 결정 대기', updatedAt: new Date().toISOString() },
                { name: '김민규', phone: '010-2646-7785', category: '미연락', isUrgent: false, product: '에어컨', notes: '이사 가전 상담 예정', updatedAt: new Date().toISOString() },
                { name: '차은주', phone: '010-4875-9936', category: '상담진행', isUrgent: false, product: '식기세척기', notes: '설치 환경 확인 중', updatedAt: new Date().toISOString() },
                { name: '최진우', phone: '010-3814-7221', category: '미연락', isUrgent: false, product: '티비', notes: '75인치 모델 문의', updatedAt: new Date().toISOString() },
                { name: '최나임', phone: '010-3091-4080', category: '상담진행', isUrgent: true, product: '인덕션', notes: '조건 최종 조율 중 (긴급)', updatedAt: new Date().toISOString() },
                { name: '임수정', phone: '010-2521-5006', category: '상담진행', isUrgent: false, product: '냉장고', notes: '상담 중', updatedAt: new Date().toISOString() },
                { name: '박정근(담당)', phone: '010-0000-0000', category: '상담진행', isUrgent: true, product: '미지정', notes: '관리자 본인 카드', updatedAt: new Date().toISOString() }
            ];
            for (const item of initialList) {
                const id = 'seed-' + Math.random().toString(36).substr(2, 5);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), item);
            }
        }

        function renderFallback() {
            render();
            document.getElementById('loading-screen').classList.add('hidden');
        }

        // 3. AI 사진 인식 (수리 및 강화)
        window.handleImageRecognition = async function(input) {
            const file = input.files[0]; if (!file) return;
            const loader = document.getElementById('ai-loading');
            const mainLoader = document.getElementById('loading-screen');
            loader.classList.remove('hidden');
            mainLoader.classList.remove('hidden');
            document.getElementById('loading-text').innerText = "AI가 장부 사진을 정밀 분석 중입니다...";

            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                const prompt = "CRM 전문가로서 장부나 명함 사진에서 고객 {name: 성함, phone: 번호, notes: 상담내용}을 추출하세요. 반드시 JSON 배열 형식 [{...}]으로만 답하세요. 8자리 번호면 010을 붙이세요. 분석 불가 시 빈 리스트 []를 반환하세요.";
                
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }] })
                    });
                    const result = await res.json();
                    const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const jsonMatch = rawText.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        const items = JSON.parse(jsonMatch[0]);
                        for (const item of items) {
                            if (item.name || item.phone) {
                                await smartSaveOrUpdate({ ...item, category: '미연락', product: '미지정' });
                            }
                        }
                    }
                } catch (e) { alert("AI 분석 실패. 다시 시도해 주세요."); }
                
                loader.classList.add('hidden');
                mainLoader.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        // 4. 저장 로직
        window.smartSaveOrUpdate = async (data) => {
            const cleanPhone = (data.phone || '').toString().replace(/[^0-9]/g, '');
            const ts = new Date().toISOString();
            
            const existing = !editingId && cleanPhone !== "" ? customers.find(c => c.phone?.replace(/[^0-9]/g, '') === cleanPhone) : null;
            const targetId = editingId || (existing ? existing.id : 'id-' + Date.now() + Math.random().toString(36).substr(2, 4));
            
            const payload = {
                name: data.name || "신규고객",
                phone: cleanPhone.length === 8 ? '010' + cleanPhone : cleanPhone,
                category: data.category || '미연락',
                product: data.product || '미지정',
                notes: data.notes || '',
                isUrgent: data.isUrgent || (existing ? existing.isUrgent : false),
                nextContactDate: data.nextContactDate || '',
                imageData: data.imageData || currentImageData || (existing ? existing.imageData : ""),
                updatedAt: ts
            };

            if (existing && !editingId) {
                payload.notes = `[추가] ${data.notes}\n---\n${existing.notes}`;
            }

            if (auth?.currentUser) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', targetId), payload, { merge: true });
            }
        };

        // 5. 렌더링 (품목별 정렬 최적화)
        window.render = function() {
            const container = document.getElementById('customerList'); if (!container) return;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortFilter').value;
            const pFilter = document.getElementById('productFilter').value;
            
            // 통계
            if (document.getElementById('stat-미연락')) document.getElementById('stat-미연락').innerText = customers.filter(c => c.category === '미연락').length;
            if (document.getElementById('stat-상담진행')) document.getElementById('stat-상담진행').innerText = customers.filter(c => c.category === '상담진행').length;
            if (document.getElementById('stat-사은품')) document.getElementById('stat-사은품').innerText = customers.filter(c => c.category === '사은품').length;
            if (document.getElementById('stat-urgent')) document.getElementById('stat-urgent').innerText = customers.filter(c => c.isUrgent === true).length;

            let filtered = [];
            if (currentCategory === '전체') filtered = customers;
            else if (currentCategory === '긴급') filtered = customers.filter(c => c.isUrgent === true);
            else filtered = customers.filter(c => c.category === currentCategory);

            filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search) || (c.phone || '').includes(search) || (c.product || '').toLowerCase().includes(search));
            if (pFilter !== 'all') filtered = filtered.filter(c => (c.product || '미지정') === pFilter);

            // 정렬 (긴급 우선 + 품목별 정렬 포함)
            filtered.sort((a, b) => {
                const aU = a.isUrgent === true ? 0 : 1; const bU = b.isUrgent === true ? 0 : 1;
                if (aU !== bU) return aU - bU;
                
                if (sortMode === 'update') return new Date(b.updatedAt) - new Date(a.updatedAt);
                if (sortMode === 'contact') return new Date(a.nextContactDate || '9999-12-31') - new Date(b.nextContactDate || '9999-12-31');
                if (sortMode === 'product') return (a.product || '미지정').localeCompare(b.product || '미지정');
                return (a.name || '').localeCompare(b.name || '');
            });

            document.getElementById('totalBadge').innerText = `${filtered.length} 명`;
            container.innerHTML = '';

            filtered.forEach(c => {
                const isUrgent = c.isUrgent === true;
                const pOpts = products.map(p => `<option value="${p}" ${c.product === p ? 'selected' : ''}>${p}</option>`).join('');
                const cOpts = categories.map(cat => `<option value="${cat}" ${c.category === cat ? 'selected' : ''}>${cat}</option>`).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-[28px] border ${isUrgent ? 'urgent-card' : 'border-slate-100'} shadow-sm transition-all active:scale-[0.99]">
                        <div class="flex justify-between items-center mb-2.5">
                            <div class="flex items-center gap-2 flex-1 overflow-hidden">
                                <div class="overflow-hidden text-left">
                                    <h4 class="font-black text-slate-800 text-base leading-tight truncate">
                                        ${c.name} ${isUrgent ? '<i class="fa-solid fa-fire-flame-curved text-red-500 ml-0.5 animate-pulse"></i>' : ''}
                                    </h4>
                                    <p class="text-[10px] font-bold text-slate-300 font-mono tracking-tighter">${c.phone || '번호없음'}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 ml-2">
                                <button onclick="toggleUrgent('${c.id}')" class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] shadow-sm transition-all ${isUrgent ? 'urgent-btn-active' : 'bg-slate-50 text-slate-400 active-scale'}"><i class="fa-solid fa-bell"></i></button>
                                <select onchange="fastUpdate('${c.id}', 'category', this.value)" class="direct-select category-direct-select">${cOpts}</select>
                                <select onchange="fastUpdate('${c.id}', 'product', this.value)" class="direct-select product-select">${pOpts}</select>
                            </div>
                        </div>
                        ${c.imageData ? `<img src="${c.imageData}" class="image-preview-card" onclick="window.open('${c.imageData}')">` : ''}
                        <div class="flex flex-wrap gap-1.5 mb-3 items-center text-[8px] font-black text-slate-300 uppercase">
                            <span><i class="fa-solid fa-clock mr-0.5"></i> ${new Date(c.updatedAt).toLocaleDateString()}</span>
                            ${c.nextContactDate ? `<span class="text-red-500 bg-red-50 px-2 py-0.5 rounded-full border border-red-100 font-bold tracking-tighter">기한: ${c.nextContactDate}</span>` : ''}
                        </div>
                        <div class="memo-container mb-4">
                            <textarea class="inline-notes" onblur="fastUpdate('${c.id}', 'notes', this.value)" placeholder="메모가 없습니다..." rows="2">${c.notes || ''}</textarea>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <a href="tel:${c.phone}" class="flex-[3] h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center gap-2 font-black text-xs active-scale no-underline shadow-md"><i class="fa-solid fa-phone"></i> 통화</a>
                            <a href="sms:${c.phone}" class="flex-[3] h-10 bg-white border border-slate-200 text-slate-800 rounded-xl flex items-center justify-center gap-2 font-black text-xs active-scale no-underline shadow-sm"><i class="fa-solid fa-message text-slate-400"></i> 문자</a>
                            <button onclick="editCustomer('${c.id}')" class="flex-1 h-10 bg-slate-50 text-slate-500 rounded-xl flex items-center justify-center active-scale"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="requestDelete('${c.id}')" class="flex-1 h-10 bg-slate-50 text-slate-300 rounded-xl flex items-center justify-center active-scale hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        // 6. 기타 제어
        window.fastUpdate = async (id, field, value) => {
            const ts = new Date().toISOString();
            if (auth?.currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), { [field]: value, updatedAt: ts }, { merge: true });
        };
        window.toggleUrgent = async (id) => { const c = customers.find(item => item.id === id); if (c) await fastUpdate(id, 'isUrgent', !(c.isUrgent === true)); };
        window.saveCustomer = async function() { const name = document.getElementById('formName').value; const phone = document.getElementById('formPhone').value; if (!name || !phone) return alert('필수 입력 누락'); await smartSaveOrUpdate({ name: name.trim(), phone: phone.trim(), category: document.getElementById('formCategory').value, product: document.getElementById('formProduct').value, notes: document.getElementById('formNotes').value, nextContactDate: document.getElementById('formDate').value, imageData: currentImageData }); closeModal(); };
        window.requestDelete = (id) => { deletingId = id; document.getElementById('deleteModal').classList.remove('hidden'); document.getElementById('deleteModal').classList.add('flex'); document.getElementById('confirmDeleteBtn').onclick = async () => { if (auth?.currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', deletingId)); closeDeleteModal(); }; };
        window.closeDeleteModal = () => { document.getElementById('deleteModal').classList.add('hidden'); deletingId = null; };
        window.setCategory = (cat) => { currentCategory = cat; document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive'); document.getElementById(`tab-${cat}`).className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-active'; render(); };
        window.openModal = function() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); removeImage(); };
        window.closeModal = function() { document.getElementById('modal').classList.add('hidden'); editingId = null; removeImage(); document.getElementById('formName').value=''; document.getElementById('formPhone').value=''; document.getElementById('formNotes').value=''; };
        window.editCustomer = function(id) { const c = customers.find(item => item.id === id); if (!c) return; editingId = id; openModal(); document.getElementById('formName').value = c.name; document.getElementById('formPhone').value = c.phone; document.getElementById('formProduct').value = c.product; document.getElementById('formNotes').value = c.notes; document.getElementById('formCategory').value = c.category; document.getElementById('formDate').value = c.nextContactDate || ''; if (c.imageData) { currentImageData = c.imageData; document.getElementById('formImagePreview').src = c.imageData; document.getElementById('imageArea').classList.remove('hidden'); } };
        window.previewImage = function(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { currentImageData = e.target.result; document.getElementById('formImagePreview').src = currentImageData; document.getElementById('imageArea').classList.remove('hidden'); }; reader.readAsDataURL(file); };
        window.removeImage = () => { currentImageData = ""; document.getElementById('imageArea').classList.add('hidden'); };
        window.smartParseAction = async function() { const input = document.getElementById('aiInput').value.trim(); if (!input) return; const words = input.split(/\s+/); await smartSaveOrUpdate({ name: words[0], phone: words[1] || "", product: words[2] || "미지정", notes: words.slice(3).join(" ") }); closeModal(); document.getElementById('aiInput').value = ""; };
        window.startSmartVoice = () => { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRecognition) return; const rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.onstart = () => { document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('loading-text').innerText = "말씀해 주세요..."; }; rec.onend = () => document.getElementById('loading-screen').classList.add('hidden'); rec.onresult = (e) => { const text = e.results[0][0].transcript; openModal(); document.getElementById('aiInput').value = text; }; rec.start(); };
    </script>
</body>
</html>
