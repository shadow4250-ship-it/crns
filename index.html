<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .active-scale:active { transform: scale(0.97); transition: 0.1s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 select-none">

    <div id="loading-screen" class="fixed inset-0 z-[200] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-slate-900 rounded-full loader-spin mb-4"></div>
        <h2 class="font-black text-slate-800 text-lg uppercase tracking-widest italic">Syncing CRM</h2>
        <p class="text-slate-400 text-xs mt-2">클라우드 명단을 불러오고 있습니다.</p>
    </div>

    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 px-6 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tighter italic uppercase">CRM</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Cloud Connected</p>
        </div>
        <button onclick="openModal()" class="bg-slate-900 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg active-scale">
            <i class="fa-solid fa-plus"></i>
        </button>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        <div id="alertBanner" class="hidden bg-slate-900 text-white rounded-[32px] p-6 shadow-xl animate-in fade-in">
            <div class="flex items-center gap-3 mb-4">
                <i class="fa-solid fa-bell text-yellow-400 animate-bounce"></i>
                <p class="text-lg font-black italic">오늘 연락 기한 <span id="alertCount" class="text-yellow-400">0</span>명</p>
            </div>
            <div id="alertList" class="space-y-2"></div>
        </div>

        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" id="searchInput" oninput="render()" placeholder="이름 또는 전화번호 검색..." 
                class="w-full pl-11 pr-4 py-4 bg-white border border-slate-200 rounded-[22px] focus:outline-none shadow-sm text-sm font-bold">
        </div>

        <div class="flex items-center justify-center gap-4 text-[10px] font-black text-slate-300 uppercase tracking-widest">
            <i class="fa-solid fa-desktop"></i> PC <span class="w-8 h-[1px] bg-slate-200"></span> <i class="fa-solid fa-mobile-screen"></i> Mobile
        </div>

        <div id="customerList" class="space-y-3"></div>
    </main>

    <div id="modal" class="fixed inset-0 z-[110] bg-white hidden flex-col">
        <div class="p-5 border-b flex justify-between items-center bg-slate-50/50">
            <button onclick="closeModal()" class="p-2 text-slate-400"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h2 class="font-black text-lg text-slate-800 italic uppercase">고객 정보 상세</h2>
            <button onclick="saveCustomer()" class="text-blue-600 font-black px-4">완료</button>
        </div>
        <div class="p-6 space-y-6 overflow-y-auto pb-32 no-scrollbar">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 ml-1">성함</label>
                    <input id="formName" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-black text-sm outline-none">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 ml-1">상태</label>
                    <select id="formStatus" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none">
                        <option value="잠재고객">잠재고객</option>
                        <option value="계약완료">계약완료</option>
                        <option value="긴급">긴급</option>
                    </select>
                </div>
            </div>
            <div class="space-y-1.5">
                <label class="text-[10px] font-black text-slate-400 ml-1">연락처</label>
                <input id="formPhone" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold font-mono text-sm outline-none">
            </div>
            <div class="space-y-1.5">
                <label class="text-[10px] font-black text-slate-400 ml-1">다음 연락 예정일</label>
                <input type="date" id="formDate" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none">
            </div>
            <div class="space-y-1.5">
                <div class="flex justify-between items-center px-1">
                    <label class="text-[10px] font-black text-slate-400">상담 메모</label>
                    <button onclick="startVoice()" class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1 rounded-full active-scale">
                        <i class="fa-solid fa-microphone mr-1"></i> 음성 입력
                    </button>
                </div>
                <textarea id="formNotes" rows="8" class="w-full p-5 bg-slate-50 border border-slate-100 rounded-[28px] resize-none text-sm italic leading-relaxed outline-none"></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t border-slate-100">
            <button onclick="saveCustomer()" class="w-full py-5 bg-slate-900 text-white rounded-[26px] font-black shadow-xl active-scale">클라우드 동기화 저장</button>
        </div>
    </div>

    <div id="voiceOverlay" class="fixed inset-0 z-[200] bg-slate-900/90 backdrop-blur-md hidden flex flex-col items-center justify-center text-white p-10 text-center">
        <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mb-6 animate-pulse border border-white/20">
            <i class="fa-solid fa-microphone text-3xl text-red-400"></i>
        </div>
        <h3 class="text-xl font-black mb-2 italic">듣고 있습니다</h3>
        <p class="text-white/40 text-sm font-bold uppercase tracking-widest">Voice Recording...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. 설정 (Canvas 환경 변수 직접 참조)
        const firebaseConfig = JSON.parse('__firebase_config');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'crm-park-final-sync';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let customers = [];
        let editingId = null;
        let currentUser = null;

        // 2. 인증 및 데이터 복구 리스트
        const recoveryList = [
            { name: '에어컨 신규', phone: '010-2985-0955', status: '긴급', notes: '시스템에어컨 희망 / 5월 15일까지 연락 필수', updatedAt: new Date().toISOString() },
            { name: '조수진', phone: '010-4416-8488', status: '잠재고객', notes: '혼수 가전 상담 / 박정근 담당', updatedAt: new Date().toISOString() },
            { name: '김민규', phone: '010-2646-7785', status: '잠재고객', notes: '이사 가전 상담 / 박정근 담당', updatedAt: new Date().toISOString() },
            { name: '박정권', phone: '010-9107-5798', status: '잠재고객', notes: '주요 상담 고객님', updatedAt: new Date().toISOString() },
            { name: '차은주', phone: '010-4875-9936', status: '잠재고객', notes: '5실 이상 상담 건', updatedAt: new Date().toISOString() },
            { name: '최나임', phone: '010-3091-4080', status: '잠재고객', notes: '거실+안방1 구조 확인', updatedAt: new Date().toISOString() }
        ];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                startSync();
            }
        });

        signInAnonymously(auth);

        // 3. 실시간 동기화
        function startSync() {
            const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
            onSnapshot(customersRef, async (snapshot) => {
                if (snapshot.empty) {
                    for (const item of recoveryList) { await addDoc(customersRef, item); }
                } else {
                    customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                    document.getElementById('loading-screen').style.display = 'none';
                }
            }, (err) => { console.error("권한 에러:", err); });
        }

        // 4. 렌더링
        window.render = function() {
            const container = document.getElementById('customerList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const today = new Date().toISOString().split('T')[0];
            
            // 오늘 연락 고객 필터링
            const alerts = customers.filter(c => c.nextContactDate === today);
            const alertBanner = document.getElementById('urgentAlert');
            const alertContainer = document.getElementById('alertBanner');
            const alertList = document.getElementById('alertList');
            
            if (alerts.length > 0) {
                alertContainer.classList.remove('hidden');
                document.getElementById('alertCount').innerText = alerts.length;
                alertList.innerHTML = alerts.map(c => `
                    <div class="flex items-center justify-between bg-white/10 p-3 rounded-2xl border border-white/10">
                        <span class="font-bold text-sm ml-2">${c.name} 님</span>
                        <div class="flex gap-2">
                            <a href="tel:${c.phone.replace(/[^0-9]/g,'')}" class="p-2 bg-white/10 rounded-lg text-white"><i class="fa-solid fa-phone text-xs"></i></a>
                            <a href="sms:${c.phone.replace(/[^0-9]/g,'')}" class="p-2 bg-white/10 rounded-lg text-white"><i class="fa-solid fa-message text-xs"></i></a>
                        </div>
                    </div>
                `).join('');
            } else {
                alertContainer.classList.add('hidden');
            }

            container.innerHTML = '';
            const filtered = customers.filter(c => 
                (c.name || '').includes(search) || (c.phone || '').includes(search)
            ).sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            filtered.forEach(c => {
                const isLate = c.nextContactDate && c.nextContactDate <= today;
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-[36px] border ${isLate ? 'border-red-100 ring-1 ring-red-50' : 'border-slate-100'} shadow-sm active-scale">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-black text-slate-800 text-lg leading-tight mb-1 flex items-center gap-2">
                                    ${c.name} ${isLate ? '<span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span>' : ''}
                                </h4>
                                <p class="text-[11px] font-bold text-slate-400 font-mono tracking-tight">${c.phone}</p>
                            </div>
                            <div class="text-[9px] font-black bg-slate-50 text-slate-400 px-3 py-1.5 rounded-full uppercase border border-slate-100">
                                ${c.status}
                            </div>
                        </div>
                        ${c.nextContactDate ? `<p class="text-[10px] font-bold ${isLate ? 'text-red-500' : 'text-slate-400'} mb-3"><i class="fa-solid fa-calendar-check mr-1"></i> 연락 예정: ${c.nextContactDate}</p>` : ''}
                        <div class="bg-slate-50/50 rounded-2xl p-4 mb-4 border border-slate-50 text-[13px] text-slate-600 font-medium italic leading-relaxed">
                            "${c.notes || '상담 기록이 없습니다.'}"
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="tel:${c.phone.replace(/[^0-9]/g,'')}" class="flex-[4] bg-slate-900 text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-xs shadow-md no-underline">전화</a>
                            <a href="sms:${c.phone.replace(/[^0-9]/g,'')}" class="flex-[4] bg-white border border-slate-200 text-slate-700 py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-xs no-underline shadow-sm">문자</a>
                            <button onclick="editCustomer('${c.id}')" class="flex-1 py-4 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteCustomer('${c.id}')" class="flex-1 py-4 bg-slate-50 text-slate-300 rounded-2xl flex items-center justify-center hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        // 5. 기능들
        window.saveCustomer = async function() {
            const name = document.getElementById('formName').value;
            const phone = document.getElementById('formPhone').value;
            const notes = document.getElementById('formNotes').value;
            const status = document.getElementById('formStatus').value;
            const date = document.getElementById('formDate').value;

            if (!name || !phone) return alert('이름과 번호는 필수입니다.');

            try {
                const data = { name, phone, notes, status, nextContactDate: date, updatedAt: new Date().toISOString() };
                const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
                if (editingId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', editingId), data);
                } else {
                    await addDoc(customersRef, data);
                }
                closeModal();
            } catch (e) { alert("저장 권한 부족"); }
        };

        window.startVoice = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("음성 인식이 지원되지 않습니다.");
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.onstart = () => document.getElementById('voiceOverlay').classList.remove('hidden');
            recognition.onend = () => document.getElementById('voiceOverlay').classList.add('hidden');
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('formNotes').value += (document.getElementById('formNotes').value ? ' ' : '') + text;
            };
            recognition.start();
        };

        window.openModal = function() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); };
        window.closeModal = function() { document.getElementById('modal').classList.add('hidden'); editingId = null; document.getElementById('formName').value = ''; document.getElementById('formPhone').value = ''; document.getElementById('formNotes').value = ''; document.getElementById('formDate').value = ''; };
        window.editCustomer = function(id) {
            const c = customers.find(c => c.id === id);
            editingId = id;
            document.getElementById('formName').value = c.name;
            document.getElementById('formPhone').value = c.phone;
            document.getElementById('formNotes').value = c.notes || '';
            document.getElementById('formStatus').value = c.status;
            document.getElementById('formDate').value = c.nextContactDate || '';
            openModal();
        };
        window.deleteCustomer = async function(id) {
            if (confirm('정말 삭제할까요?')) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id)); }
        };
    </script>
</body>
</html>
