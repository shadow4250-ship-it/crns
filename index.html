<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM Pro</title>
    <!-- 외부 라이브러리: Tailwind, SheetJS(Excel), FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.96); transition: 0.1s; }
        .bg-blur { backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.8); }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .theme-연락 { --theme-color: #3b82f6; --theme-bg: #eff6ff; }
        .theme-구매 { --theme-color: #10b981; --theme-bg: #f0fdf4; }
        .theme-사은품 { --theme-color: #f59e0b; --theme-bg: #fffbeb; }
        
        .tab-active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); }
        .tab-inactive { color: #94a3b8; border-bottom: 3px solid transparent; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-24 select-none theme-연락" id="mainBody">

    <!-- 로딩 화면 -->
    <div id="loading-screen" class="fixed inset-0 z-[200] bg-white flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-slate-100 border-t-slate-900 rounded-full loading-spin mb-4"></div>
        <p class="text-slate-500 font-bold text-xs uppercase tracking-[0.3em]">AI CRM System Syncing</p>
    </div>

    <!-- 헤더 -->
    <header class="sticky top-0 z-40 bg-blur border-b border-slate-200 p-3 px-5 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-slate-900 text-white rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-bolt text-sm text-yellow-400"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800 tracking-tighter italic uppercase leading-none">CRM</h1>
                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mt-1">AI Integrated Workspace</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="startSmartVoice()" class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg active-scale">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button onclick="openModal()" class="bg-slate-900 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg active-scale">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- 업무별 탭 메뉴 -->
    <nav class="sticky top-[61px] z-30 bg-white/90 backdrop-blur-md border-b border-slate-100 flex shadow-sm">
        <button onclick="setCategory('연락')" id="tab-연락" class="flex-1 py-4 text-[11px] font-black uppercase tracking-tighter transition-all tab-active">연락 관리</button>
        <button onclick="setCategory('구매')" id="tab-구매" class="flex-1 py-4 text-[11px] font-black uppercase tracking-tighter transition-all tab-inactive">구매/결제</button>
        <button onclick="setCategory('사은품')" id="tab-사은품" class="flex-1 py-4 text-[11px] font-black uppercase tracking-tighter transition-all tab-inactive">사은품/증정</button>
    </nav>

    <main class="max-w-xl mx-auto p-3 space-y-4">
        <!-- 긴급 알림 (D-Day 배너) -->
        <div id="urgentContainer" class="hidden bg-slate-900 text-white rounded-[28px] p-5 shadow-2xl animate-in fade-in slide-in-from-top-4">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-bell text-yellow-400 animate-bounce text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] font-black text-white/40 uppercase tracking-widest leading-none mb-1">D-Day Alert</p>
                    <p class="text-base font-black italic">오늘 처리 예정 <span id="urgentCount" class="text-yellow-400">0</span>명</p>
                </div>
            </div>
            <div id="urgentList" class="space-y-2"></div>
        </div>

        <!-- 검색바 -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
            <input type="text" id="searchInput" oninput="render()" placeholder="이름 또는 전화번호로 검색..." 
                class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl focus:outline-none shadow-sm text-sm font-bold placeholder:text-slate-200 transition-all focus:ring-2 focus:ring-blue-50">
        </div>

        <!-- 데이터 표시 구역 -->
        <div id="customerList" class="space-y-3"></div>
    </main>

    <!-- 입력/수정/AI분석 모달 -->
    <div id="modal" class="fixed inset-0 z-[110] bg-white hidden flex-col animate-in slide-in-from-bottom duration-300">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
            <button onclick="closeModal()" class="p-2 text-slate-400 active-scale"><i class="fa-solid fa-chevron-down text-xl"></i></button>
            <h2 id="modalTitle" class="font-black text-base text-slate-800 italic uppercase">데이터 스마트 등록</h2>
            <button onclick="saveCustomer()" class="text-blue-600 font-black px-4 text-base active-scale">저장</button>
        </div>
        <div class="p-5 space-y-6 overflow-y-auto pb-48 no-scrollbar">
            
            <!-- AI 스마트 입력 섹션 -->
            <div class="bg-indigo-50 p-5 rounded-3xl border border-indigo-100 space-y-3 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] font-black text-indigo-600 uppercase tracking-widest"><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> AI 멀티/사진/파일 일괄 분석</label>
                    <span id="ai-loading" class="hidden text-[9px] font-bold text-indigo-400 animate-pulse">AI 분석 중...</span>
                </div>
                <div class="space-y-2">
                    <textarea id="aiInput" class="w-full p-4 bg-white border border-indigo-100 rounded-2xl text-xs font-bold outline-none shadow-inner resize-none h-20" placeholder="예: 홍길동 12345678, 김철수 01022223333 구매탭"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="document.getElementById('imageUpload').click()" class="bg-white border border-indigo-200 text-indigo-500 rounded-xl py-2.5 text-[10px] font-black active-scale flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-solid fa-camera"></i> 사진/장부 분석
                        </button>
                        <button onclick="document.getElementById('excelUpload').click()" class="bg-white border border-green-200 text-green-600 rounded-xl py-2.5 text-[10px] font-black active-scale flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-solid fa-file-excel"></i> 엑셀/CSV 분석
                        </button>
                        <button id="bulkActionBtn" onclick="smartParse()" class="col-span-2 bg-indigo-600 text-white rounded-xl py-3 text-[11px] font-black active-scale shadow-md">정보 일괄 정리 및 자동 등록</button>
                    </div>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(this)">
                </div>
            </div>

            <!-- 개별 입력 필드 섹션 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">성함</label>
                    <input id="formName" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-black text-sm outline-none focus:bg-white shadow-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">업무 단계</label>
                    <select id="formCategory" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none appearance-none bg-white text-sm shadow-sm">
                        <option value="연락">연락 관리</option>
                        <option value="구매">구매/결제</option>
                        <option value="사은품">사은품/증정</option>
                    </select>
                </div>
            </div>
            <div class="space-y-1.5">
                <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">연락처 (8자리 입력 시 010 자동)</label>
                <input id="formPhone" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold font-mono text-sm outline-none focus:bg-white shadow-sm" placeholder="번호 또는 숫자 8자리">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-[9px] font-black text-red-500 ml-1 uppercase font-bold">연락 예정일</label>
                    <input type="date" id="formDate" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-[10px] outline-none shadow-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[9px] font-black text-green-600 ml-1 uppercase font-bold">배송 예정일</label>
                    <input type="date" id="formDeliveryDate" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-[10px] outline-none shadow-sm">
                </div>
            </div>
            <div id="reg-date-box" class="hidden space-y-1">
                <label class="text-[9px] font-black text-slate-300 ml-1 uppercase">시스템 등록일시</label>
                <div id="formRegDate" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-slate-400 font-bold text-[10px] italic"></div>
            </div>
            <div class="space-y-1.5">
                <div class="flex justify-between items-center px-1 mb-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">상담 메모</label>
                    <button onclick="startVoice('formNotes')" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-900 text-white rounded-full font-black text-[9px] uppercase active-scale shadow-md">
                        <i class="fa-solid fa-microphone text-red-400"></i> 메모 음성 입력
                    </button>
                </div>
                <textarea id="formNotes" rows="6" class="w-full p-5 bg-slate-50 border border-slate-100 rounded-[28px] resize-none text-sm italic leading-relaxed outline-none focus:bg-white transition-all shadow-inner" placeholder="내용을 말씀하거나 입력하세요."></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.04)]">
            <button onclick="saveCustomer()" class="w-full py-5 bg-slate-900 text-white rounded-[24px] font-black shadow-2xl active-scale text-sm uppercase tracking-[0.2em]">클라우드 실시간 저장</button>
        </div>
    </div>

    <!-- 음성 인식 전용 오버레이 -->
    <div id="voiceOverlay" class="fixed inset-0 z-[250] bg-slate-900/95 backdrop-blur-xl hidden flex flex-col items-center justify-center text-white p-10 text-center animate-in fade-in duration-300">
        <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mb-8 animate-pulse border border-white/20">
            <i class="fa-solid fa-microphone text-3xl text-red-400"></i>
        </div>
        <p class="text-xl font-black italic uppercase tracking-tighter">내용을 듣고 있습니다</p>
        <p class="text-white/30 text-[10px] mt-3 font-bold tracking-[0.3em] uppercase">AI Voice Capture Mode</p>
    </div>

    <!-- Firebase SDK 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. 설정
        const apiKey = ""; 
        const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":""}';
        const firebaseConfig = JSON.parse(configStr);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'park-crm-v27-stable';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let db, auth;
        let customers = [];
        let editingId = null;
        let currentUser = null;
        let currentCategory = '연락';

        // 핵심 명단 10인 복구
        const recoveryList = [
            { id: 'p_1', name: '에어컨 신규', phone: '010-2985-0955', category: '연락', notes: '시스템에어컨 상담 예정', nextContactDate: new Date().toISOString().split('T')[0], updatedAt: new Date().toISOString(), registeredAt: new Date().toISOString() },
            { id: 'p_2', name: '조수진', phone: '010-4416-8488', category: '구매', notes: '냉장고 결제 대기 중', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_3', name: '김민규', phone: '010-2646-7785', category: '사은품', notes: '세탁기 사은품 증정 대기', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_4', name: '최진우', phone: '010-3814-7221', category: '연락', notes: '에어컨 교체 문의', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_5', name: '장성필', phone: '010-4553-6113', category: '구매', notes: '시스템 에어컨 전체 견적', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_6', name: '임수정', phone: '010-2521-5006', category: '사은품', notes: '사은품 수령 확인 중', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_7', name: '박정권', phone: '010-9107-5798', category: '연락', notes: '주요 상담 고객님', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_8', name: '차은주', phone: '010-4875-9936', category: '구매', notes: '5실 이상 견적', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_9', name: '최나임', phone: '010-3091-4080', category: '사은품', notes: '거실+안방 구조 확인', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
            { id: 'p_10', name: '박정근(담당)', phone: '010-0000-0000', category: '연락', notes: '시스템 관리자', registeredAt: new Date().toISOString(), updatedAt: new Date().toISOString() }
        ];

        // 전화번호 포맷팅 (010 자동 보정 로직 포함)
        const formatPhone = (val) => {
            if (!val) return '';
            let num = val.toString().replace(/[^0-9]/g, '');
            if (num.length === 8) num = '010' + num;
            if (num.length === 11) return num.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            if (num.length === 10) return num.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
            return val;
        };

        // 2. 초기 구동
        const init = async () => {
            if (firebaseConfig.apiKey) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                onAuthStateChanged(auth, (user) => {
                    if (user) { currentUser = user; startFirestoreSync(); }
                });
                try {
                    if (initialAuthToken) { await signInWithCustomToken(auth, initialAuthToken); } 
                    else { await signInAnonymously(auth); }
                } catch (e) { useLocalStorage(); }
            } else { useLocalStorage(); }
        };

        const startFirestoreSync = () => {
            if (!currentUser || !db) return;
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
            onSnapshot(ref, (snapshot) => {
                if (!snapshot.empty) {
                    customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                } else {
                    recoveryList.forEach(item => setDoc(doc(ref, item.id), item));
                }
                document.getElementById('loading-screen').style.display = 'none';
            }, () => useLocalStorage());
        };

        const useLocalStorage = () => {
            customers = JSON.parse(localStorage.getItem('crm_data_v27')) || recoveryList;
            render();
            document.getElementById('loading-screen').style.display = 'none';
        };

        const saveToStorage = () => localStorage.setItem('crm_data_v27', JSON.stringify(customers));

        // 3. AI 분석 로직 (강력한 정제 로직 적용)
        window.smartParse = async function(customInput = null) {
            const input = customInput || document.getElementById('aiInput').value;
            if (!input || !input.trim()) return alert("입력된 내용이 없습니다.");
            
            const loader = document.getElementById('ai-loading');
            const btn = document.getElementById('bulkActionBtn');
            
            loader.classList.remove('hidden'); loader.innerText = "AI 분석 중...";
            if (btn) btn.disabled = true;

            const systemPrompt = `당신은 CRM 비서입니다. 입력된 텍스트에서 한 명 이상의 고객 정보를 추출하여 반드시 JSON 배열 형태로 응답하세요. 
            카테고리가 명시되지 않았다면 '연락'으로 하세요. 번호에 010이 없거나 8자리라면 010을 앞에 붙이세요. 
            형식: [{ "name": "이름", "phone": "01000000000", "notes": "내용", "category": "연락/구매/사은품" }]
            데이터 외의 다른 설명은 절대로 하지 마세요.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: input }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                
                const result = await response.json();
                let resultText = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                // JSON만 남기기 위한 강력한 정규화 (Vercel 배포 에러 방지)
                const jsonMatch = resultText.match(/\[[\s\S]*\]|\{[\s\S]*\}/);
                if (jsonMatch) resultText = jsonMatch[0];
                
                const parsedData = JSON.parse(resultText);
                const bulkData = Array.isArray(parsedData) ? parsedData : [parsedData];

                for (const item of bulkData) {
                    if (item.name || item.phone) {
                        await saveDirectly(item);
                    }
                }
                
                loader.innerText = `${bulkData.length}건 등록 완료!`;
                setTimeout(() => { loader.classList.add('hidden'); closeModal(); }, 1000);
                document.getElementById('aiInput').value = '';
            } catch (e) { 
                console.error("AI Error:", e);
                loader.innerText = "분석 실패 (직접 입력 권장)"; 
                setTimeout(() => loader.classList.add('hidden'), 2500); 
            } finally { if (btn) btn.disabled = false; }
        };

        const saveDirectly = async (data) => {
            const ts = new Date().toISOString();
            const entry = { 
                name: data.name || '미지정 고객', 
                phone: formatPhone(data.phone || ''), 
                notes: data.notes || '', 
                category: data.category || '연락', 
                updatedAt: ts, 
                registeredAt: ts 
            };
            if (db && currentUser) {
                const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), entry);
            } else {
                customers.unshift({ id: Date.now().toString() + Math.random(), ...entry });
                saveToStorage(); render();
            }
        };

        window.handleExcelUpload = function(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                smartParse(XLSX.utils.sheet_to_txt(workbook.Sheets[workbook.SheetNames[0]]));
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleImageUpload = async function(input) {
            const file = input.files[0]; if (!file) return;
            const loader = document.getElementById('ai-loading');
            loader.classList.remove('hidden'); loader.innerText = "사진 분석 중...";
            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                const prompt = "이미지에서 이름, 번호, 메모를 추출하여 JSON 배열로 응답하세요. [{name, phone, notes}]";
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const json = await res.json();
                    let raw = json.candidates[0].content.parts[0].text;
                    const match = raw.match(/\[[\s\S]*\]/);
                    if (match) raw = match[0];
                    const bulkData = JSON.parse(raw);
                    if (Array.isArray(bulkData)) { for (const data of bulkData) { await saveDirectly(data); } loader.innerText = `${bulkData.length}건 등록 완료!`; }
                    setTimeout(() => { loader.classList.add('hidden'); closeModal(); }, 2000);
                } catch (e) { loader.innerText = "분석 실패"; setTimeout(() => loader.classList.add('hidden'), 2000); }
            };
            reader.readAsDataURL(file);
        };

        // 4. UI 렌더링
        window.setCategory = (cat) => {
            currentCategory = cat;
            const body = document.getElementById('mainBody');
            if (body) body.className = `bg-[#f8fafc] text-slate-900 pb-24 select-none theme-${cat}`;
            document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex-1 py-4 text-[11px] font-black uppercase tracking-tighter transition-all tab-inactive');
            const activeTab = document.getElementById(`tab-${cat}`);
            if (activeTab) activeTab.className = 'flex-1 py-4 text-[11px] font-black uppercase tracking-tighter transition-all tab-active';
            render();
        };

        window.openModal = function() { 
            const modal = document.getElementById('modal'); if (!modal) return;
            modal.classList.remove('hidden'); modal.classList.add('flex'); 
            document.getElementById('formCategory').value = currentCategory;
            document.getElementById('reg-date-box').classList.add('hidden'); 
        };

        window.closeModal = function() { 
            const modal = document.getElementById('modal'); if (!modal) return;
            modal.classList.add('hidden'); editingId = null; 
            ['formName', 'formPhone', 'formNotes', 'formDate', 'formDeliveryDate', 'aiInput'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        };

        window.startSmartVoice = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("브라우저가 음성 인식을 지원하지 않습니다.");
            const rec = new SpeechRecognition(); rec.lang = 'ko-KR';
            rec.onstart = () => document.getElementById('voiceOverlay').classList.remove('hidden');
            rec.onend = () => { document.getElementById('voiceOverlay').classList.add('hidden'); setTimeout(() => { if(document.getElementById('aiInput').value) smartParse(); }, 500); };
            rec.onresult = (e) => { openModal(); document.getElementById('aiInput').value = e.results[0][0].transcript; };
            rec.start();
        };

        window.startVoice = function(id) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const rec = new SpeechRecognition(); rec.lang = 'ko-KR';
            rec.onstart = () => document.getElementById('voiceOverlay').classList.remove('hidden');
            rec.onend = () => document.getElementById('voiceOverlay').classList.add('hidden');
            rec.onresult = (e) => { const target = document.getElementById(id); if (target) target.value += (target.value ? ' ' : '') + e.results[0][0].transcript; };
            rec.start();
        };

        window.moveNext = async (id, currentCat) => {
            const nextMap = { '연락': '구매', '구매': '사은품', '사은품': '연락' };
            const nextCat = nextMap[currentCat];
            const ts = new Date().toISOString();
            if (db && currentUser) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), { category: nextCat, updatedAt: ts }, { merge: true });
            } else {
                const idx = customers.findIndex(c => c.id === id);
                if (idx !== -1) { customers[idx].category = nextCat; customers[idx].updatedAt = ts; saveToStorage(); render(); }
            }
        };

        window.render = function() {
            const container = document.getElementById('customerList'); if (!container) return;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const today = new Date().toISOString().split('T')[0];
            const tabCustomers = customers.filter(c => (c.category || '연락') === currentCategory);
            
            const alerts = tabCustomers.filter(c => c.nextContactDate === today);
            const urgentContainer = document.getElementById('urgentContainer');
            if (alerts.length > 0) {
                urgentContainer.classList.remove('hidden');
                document.getElementById('urgentCount').innerText = alerts.length;
                document.getElementById('urgentList').innerHTML = alerts.map(c => `
                    <div class="flex items-center justify-between bg-white/10 p-3.5 rounded-2xl border border-white/10 active-scale">
                        <span class="font-black text-sm ml-1">${c.name}</span>
                        <div class="flex gap-2"><a href="tel:${c.phone?.replace(/[^0-9]/g,'')}" class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-phone text-xs"></i></a></div>
                    </div>
                `).join('');
            } else { urgentContainer.classList.add('hidden'); }

            container.innerHTML = '';
            const filtered = tabCustomers.filter(c => (c.name || '').toLowerCase().includes(search) || (c.phone || '').includes(search))
                .sort((a, b) => {
                    const isA = a.nextContactDate && a.nextContactDate <= today;
                    const isB = b.nextContactDate && b.nextContactDate <= today;
                    if (isA && !isB) return -1;
                    if (!isA && isB) return 1;
                    return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
                });

            if (filtered.length === 0) { container.innerHTML = `<div class="py-20 text-center text-slate-300 font-black text-[10px] uppercase tracking-[0.4em] italic opacity-50">Empty Directory</div>`; }

            filtered.forEach(c => {
                const isLate = c.nextContactDate && c.nextContactDate <= today;
                const nextInfo = currentCategory === '연락' ? '구매 이동' : (currentCategory === '구매' ? '사은품 이동' : '연락 회귀');
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-[32px] border ${isLate ? 'border-red-100 ring-2 ring-red-50' : 'border-slate-100'} shadow-sm active:scale-[0.98] transition-all">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <button onclick="moveNext('${c.id}', '${currentCategory}')" class="w-9 h-9 rounded-2xl bg-[#f8fafc] border border-slate-100 flex items-center justify-center text-slate-400 hover:bg-slate-900 hover:text-white transition-all shadow-sm"><i class="fa-solid fa-arrow-right text-xs"></i></button>
                                <div><h4 class="font-black text-slate-800 text-lg leading-tight flex items-center gap-1.5">${c.name} ${isLate ? '<span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span>' : ''}</h4><p class="text-[10px] font-bold text-slate-400 font-mono tracking-tighter">${formatPhone(c.phone || 'no phone')}</p></div>
                            </div>
                            <div class="text-[7px] font-black bg-slate-50 text-slate-400 px-2 py-1 rounded-full uppercase tracking-widest">${nextInfo}</div>
                        </div>
                        <div class="flex flex-wrap gap-2.5 mb-4 px-0.5 opacity-80">
                            <span class="text-[8px] font-bold text-slate-300"><i class="fa-solid fa-clock mr-1"></i> ${new Date(c.registeredAt || Date.now()).toLocaleDateString()}</span>
                            ${c.nextContactDate ? `<span class="text-[8px] font-black ${isLate ? 'text-red-500' : 'text-slate-500'}"><i class="fa-solid fa-calendar-day mr-1"></i> 예정: ${c.nextContactDate}</span>` : ''}
                            ${c.deliveryDate ? `<span class="text-[8px] font-black text-green-600"><i class="fa-solid fa-truck mr-1"></i> 배송: ${c.deliveryDate}</span>` : ''}
                        </div>
                        <div class="bg-slate-50/70 rounded-2xl p-4 mb-4 border border-slate-50 text-[12px] text-slate-600 font-semibold italic truncate-2">"${c.notes || '기록 없음'}"</div>
                        <div class="flex items-center gap-2">
                            <a href="tel:${c.phone?.replace(/[^0-9]/g,'')}" class="flex-[7] bg-slate-900 text-white py-4 rounded-2xl flex items-center justify-center gap-2.5 font-black text-xs shadow-lg active-scale no-underline">전화</a>
                            <a href="sms:${c.phone?.replace(/[^0-9]/g,'')}" class="flex-[7] bg-white border-2 border-slate-200 text-slate-800 py-4 rounded-2xl flex items-center justify-center gap-2.5 font-black text-xs active-scale no-underline">문자</a>
                            <button onclick="editCustomer('${c.id}')" class="flex-1 h-12 bg-slate-100 text-slate-400 rounded-xl flex items-center justify-center active-scale"><i class="fa-solid fa-pen text-sm"></i></button>
                            <button onclick="deleteCustomer('${c.id}')" class="flex-1 h-12 bg-slate-100 text-slate-300 rounded-xl flex items-center justify-center active-scale hover:text-red-400"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        window.saveCustomer = async function() {
            const name = document.getElementById('formName').value;
            let phone = document.getElementById('formPhone').value;
            const notes = document.getElementById('formNotes').value;
            const cat = document.getElementById('formCategory').value || '연락';
            const date = document.getElementById('formDate').value;
            const delivery = document.getElementById('formDeliveryDate').value;
            
            // 필수값 체크 및 안내 강화 (AI 입력창에 내용이 있을 때 안내 추가)
            if (!name || !name.trim() || !phone || !phone.trim()) {
                const aiInputVal = document.getElementById('aiInput').value.trim();
                if (aiInputVal) {
                    return alert("상단의 [정보 일괄 정리 및 자동 등록] 버튼을 먼저 눌러서 정보를 분류해 주세요.");
                }
                return alert('성함과 연락처를 입력해 주세요.');
            }
            
            phone = formatPhone(phone);
            const existing = customers.find(c => c.id === editingId);
            const ts = new Date().toISOString();
            const data = { name, phone, notes, category: cat, nextContactDate: date, deliveryDate: delivery, updatedAt: ts, registeredAt: existing ? (existing.registeredAt || ts) : ts };
            
            if (db && currentUser) {
                const id = editingId || Date.now().toString() + Math.random().toString(36).substr(2, 5);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), data, { merge: true });
            } else {
                if (editingId) { const idx = customers.findIndex(c => c.id === editingId); if (idx !== -1) customers[idx] = { ...customers[idx], ...data }; }
                else { customers.unshift({ id: Date.now().toString() + Math.random(), ...data }); }
                saveToStorage(); render();
            }
            closeModal();
        };

        window.editCustomer = function(id) {
            const c = customers.find(c => c.id === id); if (!c) return;
            editingId = id; openModal();
            document.getElementById('formName').value = c.name || '';
            document.getElementById('formPhone').value = c.phone || '';
            document.getElementById('formNotes').value = c.notes || '';
            document.getElementById('formCategory').value = c.category || '연락';
            document.getElementById('formDate').value = c.nextContactDate || '';
            document.getElementById('formDeliveryDate').value = c.deliveryDate || '';
            const box = document.getElementById('reg-date-box');
            if (c.registeredAt && box) { box.classList.remove('hidden'); document.getElementById('formRegDate').innerText = new Date(c.registeredAt).toLocaleString(); }
        };

        window.deleteCustomer = async function(id) { if (confirm('삭제하시겠습니까?')) { if (db && currentUser) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id)); } else { customers = customers.filter(c => c.id !== id); saveToStorage(); render(); } } };

        init();
    </script>
</body>
</html>
