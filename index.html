<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.96); transition: 0.1s; }
        
        .theme-전체 { --theme-color: #475569; }
        .theme-긴급 { --theme-color: #ef4444; }
        .theme-미연락 { --theme-color: #f59e0b; }
        .theme-상담진행 { --theme-color: #3b82f6; }
        .theme-사은품 { --theme-color: #10b981; }
        
        .tab-active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); font-weight: 900; }
        .tab-inactive { color: #94a3b8; border-bottom: 3px solid transparent; }

        .direct-select { background: #f1f5f9; border-radius: 99px; padding: 4px 10px; font-weight: 800; color: #475569; appearance: none; outline: none; border: 1px solid #e2e8f0; text-align: center; font-size: 13px; }
        .product-select { border-color: #3b82f6; color: #3b82f6; min-width: 80px; }

        .urgent-card { border: 2px solid #ef4444 !important; background-color: #fffafb !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.08); }
        .urgent-btn-active { background: #ef4444 !important; color: white !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .memo-box { background: #ffffff; border: 1px solid #f1f5f9; border-radius: 12px; padding: 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); text-align: left; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-24 select-none theme-전체" id="mainBody">

    <!-- [1] 보안 화면 (비밀번호: 7604) -->
    <div id="lock-screen" class="fixed inset-0 z-[300] bg-white flex flex-col items-center justify-center p-6 transition-all duration-300">
        <div class="w-full max-w-[260px] text-center space-y-10">
            <div class="space-y-1">
                <h1 class="text-5xl font-black tracking-tighter text-slate-900 uppercase italic leading-none">CRM</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em]">Fast Access</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="passwordInput" inputmode="numeric" autofocus maxlength="4"
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-[28px] py-6 text-center text-4xl font-black outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner" 
                    placeholder="••••">
                <button id="loginBtn"
                    class="w-full bg-slate-900 text-white py-5 rounded-[28px] font-black active-scale shadow-2xl text-lg uppercase tracking-wider">접속하기</button>
            </div>
            <p id="password-error" class="hidden text-red-500 text-xs font-bold animate-pulse">암호가 올바르지 않습니다.</p>
        </div>
    </div>

    <!-- [2] 동기화 로딩 (앱 진입 후 배경 동기화 시에만) -->
    <div id="sync-loading" class="fixed inset-0 z-[250] bg-white/95 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 transition-opacity">
        <div class="w-12 h-12 border-4 border-slate-100 border-t-blue-600 rounded-full loading-spin mb-4 shadow-sm"></div>
        <p class="text-slate-500 font-black text-[11px] tracking-widest uppercase italic">데이터 동기화 중...</p>
    </div>

    <!-- [3] 메인 UI 영역 (비밀번호 입력 전까지 히든) -->
    <div id="main-container" class="hidden">
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 p-4 px-5 flex justify-between items-center shadow-sm">
            <h1 class="text-2xl font-black tracking-tighter uppercase leading-none italic">CRM</h1>
            <div class="flex items-center gap-2">
                <button onclick="window.openModal()" class="w-11 h-11 bg-slate-900 text-white rounded-2xl flex items-center justify-center shadow-lg active-scale">
                    <i class="fa-solid fa-plus text-lg"></i>
                </button>
            </div>
        </header>

        <!-- 파이프라인 통계 -->
        <div class="px-4 pt-4 flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <div class="stat-box bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-red-500 uppercase tracking-tighter">Emergency</p>
                <p id="stat-urgent" class="text-lg font-black text-slate-800 leading-tight">0</p>
            </div>
            <div class="stat-box bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-orange-500 uppercase tracking-tighter">Wait</p>
                <p id="stat-미연락" class="text-lg font-black text-slate-800 leading-tight">0</p>
            </div>
            <div class="stat-box bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-blue-500 uppercase tracking-tighter">Consult</p>
                <p id="stat-상담진행" class="text-lg font-black text-slate-800 leading-tight">0</p>
            </div>
            <div class="stat-box bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-green-500 uppercase tracking-tighter">Gift</p>
                <p id="stat-사은품" class="text-lg font-black text-slate-800 leading-tight">0</p>
            </div>
        </div>

        <nav class="sticky top-[69px] z-30 bg-white border-b border-slate-100 flex shadow-sm overflow-x-auto no-scrollbar">
            <button onclick="window.setCategory('전체')" id="tab-전체" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-active">전체</button>
            <button onclick="window.setCategory('긴급')" id="tab-긴급" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">긴급관리</button>
            <button onclick="window.setCategory('미연락')" id="tab-미연락" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">미연락</button>
            <button onclick="window.setCategory('상담진행')" id="tab-상담진행" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">상담진행</button>
            <button onclick="window.setCategory('사은품')" id="tab-사은품" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">사은품</button>
        </nav>

        <main class="max-w-xl mx-auto p-3 space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                <input type="text" id="searchInput" oninput="window.render()" placeholder="이름, 번호, 품목 검색..." 
                    class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-[18px] focus:outline-none shadow-sm text-sm font-bold">
            </div>
            
            <div class="flex items-center justify-between px-1">
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
                    <select id="sortFilter" onchange="window.render()" class="bg-white border border-slate-200 rounded-full px-3 py-1.5 text-[10px] font-black text-slate-600 outline-none shadow-sm min-w-[100px]">
                        <option value="update">최신 수정순</option>
                        <option value="product">품목별 정렬</option>
                        <option value="name">이름 가나다순</option>
                    </select>
                </div>
                <span id="totalBadge" class="text-[9px] font-black text-slate-400 bg-white border border-slate-100 px-3 py-1.5 rounded-full shadow-inner ml-2 flex-none">0 명</span>
            </div>

            <div id="customerList" class="space-y-3"></div>
        </main>
    </div>

    <!-- [4] 모달 창 -->
    <div id="modal" class="fixed inset-0 z-[110] bg-white hidden flex flex-col animate-in slide-in-from-bottom duration-300">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
            <button onclick="window.closeModal()" class="p-2 text-slate-400 active-scale"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h2 id="modalTitle" class="font-black text-base text-slate-800 uppercase italic">고객 데이터 상세</h2>
            <button id="saveBtn" onclick="window.saveCustomer()" class="text-blue-600 font-black px-4 text-lg">완료</button>
        </div>
        <div class="p-5 space-y-6 overflow-y-auto pb-60 no-scrollbar text-left">
            <div class="bg-blue-50 p-5 rounded-[24px] border border-blue-100 space-y-3 shadow-sm">
                <div class="flex justify-between items-center">
                    <span class="text-blue-600 font-black text-[11px] uppercase tracking-widest"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI 스마트 입력</span>
                    <span id="ai-loading" class="hidden animate-pulse font-bold text-blue-400 text-[9px]">분석 중...</span>
                </div>
                <textarea id="smartInput" class="w-full p-4 bg-white border border-blue-100 rounded-[16px] text-sm font-bold outline-none h-24 shadow-inner" placeholder="예: 홍길동 01012345678 에어컨 상담했음"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="window.startVoiceToSmart()" class="bg-white border-2 border-blue-200 text-blue-500 rounded-xl py-3.5 text-xs font-black active-scale flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-microphone"></i> 음성 자동 분류
                    </button>
                    <button onclick="window.processSmartInput()" class="bg-blue-600 text-white rounded-xl py-3.5 text-xs font-black shadow-lg">내용 분석</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">성함 (필수)</label>
                    <input id="formName" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-black text-base outline-none focus:bg-white shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">업무 단계</label>
                    <select id="formCategory" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none bg-white shadow-sm">
                        <option value="미연락">미연락</option>
                        <option value="상담진행">상담진행</option>
                        <option value="사은품">사은품</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase tracking-tighter">연락처 (필수)</label>
                    <input id="formPhone" type="tel" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-base outline-none focus:bg-white shadow-sm" placeholder="번호 입력">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">품목</label>
                    <select id="formProduct" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm appearance-none bg-white shadow-sm">
                        <option value="미지정">미지정</option>
                        <option value="티비">티비</option>
                        <option value="냉장고">냉장고</option>
                        <option value="에어컨">에어컨</option>
                        <option value="혼수">혼수 가전</option>
                        <option value="인덕션">인덕션</option>
                        <option value="식기세척기">식세기</option>
                        <option value="김치냉장고">김냉</option>
                    </select>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 ml-1 uppercase tracking-widest">상담 상세 메모</label>
                <textarea id="formNotes" rows="8" class="w-full p-5 bg-slate-50 border border-slate-100 rounded-2xl text-base font-semibold outline-none focus:bg-white shadow-inner" placeholder="내용을 입력하세요."></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-2xl">
            <button onclick="window.saveCustomer()" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black shadow-lg text-base active-scale uppercase tracking-widest">실시간 클라우드 저장</button>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="fixed inset-0 z-[260] bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-6 transition-all">
        <div class="bg-white w-full max-w-[320px] rounded-[32px] p-8 text-center shadow-2xl">
            <div class="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-trash-can text-xl"></i>
            </div>
            <h3 class="text-lg font-black text-slate-800 mb-2">데이터를 삭제할까요?</h3>
            <div class="flex gap-3 mt-6">
                <button onclick="window.closeDeleteModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-600 rounded-2xl font-black text-xs">취소</button>
                <button id="confirmDeleteBtn" class="flex-1 py-3.5 bg-red-500 text-white rounded-2xl font-black text-xs active-scale">삭제</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ⚙️ 설정 및 고정 명단
        const masterPassword = "7604";
        const apiKey = ""; 
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'park-crm-master-final-v77';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let db, auth;
        let customers = [];
        let editingId = null;
        let deletingId = null;
        let currentCategory = '전체';
        let isAppReady = false;

        const products = ['미지정', '티비', '냉장고', '에어컨', '혼수', '인덕션', '식기세척기', '김치냉장고'];
        const categories = ['미연락', '상담진행', '사은품'];

        const recoveryList = [
            { name: '박정권', phone: '010-9107-5798', category: '상담진행', isUrgent: false, product: '미지정', notes: '주요 고객님 상담 중', updatedAt: new Date().toISOString() },
            { name: '에어컨 신규', phone: '010-2985-0955', category: '미연락', isUrgent: true, product: '에어컨', notes: '오늘 연락 필수!', updatedAt: new Date().toISOString() },
            { name: '조수진', phone: '010-4416-8488', category: '상담진행', isUrgent: false, product: '혼수', notes: '박정근 담당 상담 중', updatedAt: new Date().toISOString() },
            { name: '장성필', phone: '010-4553-6113', category: '상담진행', isUrgent: false, product: '냉장고', notes: '견적 요청 결정 대기', updatedAt: new Date().toISOString() },
            { name: '김민규', phone: '010-2646-7785', category: '미연락', isUrgent: false, product: '에어컨', notes: '이사 가전 상담 예정', updatedAt: new Date().toISOString() },
            { name: '차은주', phone: '010-4875-9936', category: '상담진행', isUrgent: false, product: '식기세척기', notes: '설치 환경 확인 중', updatedAt: new Date().toISOString() },
            { name: '최진우', phone: '010-3814-7221', category: '미연락', isUrgent: false, product: '티비', notes: '75인치 모델 문의', updatedAt: new Date().toISOString() },
            { name: '최나임', phone: '010-3091-4080', category: '상담진행', isUrgent: true, product: '인덕션', notes: '조건 조율 중 (긴급)', updatedAt: new Date().toISOString() },
            { name: '임수정', phone: '010-2521-5006', category: '상담진행', isUrgent: false, product: '냉장고', notes: '상담 진행 중', updatedAt: new Date().toISOString() },
            { name: '박정근(담당)', phone: '010-0000-0000', category: '상담진행', isUrgent: true, product: '미지정', notes: '시스템 관리용 카드', updatedAt: new Date().toISOString() }
        ];

        // [핵심] 1. 보안 체크 및 즉시 화면 전환
        window.checkPassword = function() {
            const input = document.getElementById('passwordInput').value;
            if (input === masterPassword) {
                // UI 즉시 개방 (반응 없음 현상 해결)
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-container').classList.remove('hidden');
                isAppReady = true;
                
                // 배경에서 데이터 동기화 시작
                initApp();
            } else {
                const err = document.getElementById('password-error');
                if(err) err.classList.remove('hidden');
                document.getElementById('passwordInput').value = "";
                document.getElementById('passwordInput').focus();
            }
        };

        // 초기 바인딩 (엔터키 및 버튼)
        document.getElementById('loginBtn').onclick = window.checkPassword;
        document.getElementById('passwordInput').onkeydown = (e) => { if(e.key === 'Enter') window.checkPassword(); };

        // 2. 파이어베이스 초기화 (인증 후 데이터 로드)
        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // RULE 3 준수: 인증을 먼저 실행
                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) startFirestoreSync();
                    else window.render();
                });
            } catch (e) { console.error("Auth Error:", e); window.render(); }
        }

        // 3. 실시간 데이터 동기화
        function startFirestoreSync() {
            if (!auth.currentUser) return;
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
            
            onSnapshot(ref, (snapshot) => {
                customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (customers.length === 0) seedInitialData();
                window.render();
            }, (error) => {
                console.error("Firestore Error:", error);
                window.render();
            });
        }

        async function seedInitialData() {
            if (!auth.currentUser) return;
            for (const item of recoveryList) {
                const id = item.phone || 'id-' + Date.now();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), item, { merge: true });
            }
        }

        // 4. 지능형 저장 및 분류
        window.smartSaveOrUpdate = async (data) => {
            if (!auth.currentUser) return;
            const phone = (data.phone || '').toString().replace(/[^0-9]/g, '');
            const finalPhone = phone.length === 8 ? '010' + phone : phone;
            const targetId = editingId || (finalPhone ? finalPhone : 'id-' + Date.now());
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', targetId);
            const existingDoc = await getDoc(docRef);
            const existing = existingDoc.exists() ? existingDoc.data() : null;

            const payload = {
                name: data.name || (existing ? existing.name : "신규"),
                phone: finalPhone || (existing ? existing.phone : ""),
                category: data.category || (existing ? existing.category : '미연락'),
                product: data.product || (existing ? existing.product : '미지정'),
                notes: (existing && !editingId && data.notes && data.notes !== existing.notes) 
                       ? `[추가] ${data.notes}\n---\n${existing.notes}` 
                       : (data.notes || (existing ? existing.notes : '')),
                isUrgent: data.isUrgent !== undefined ? data.isUrgent : (existing ? existing.isUrgent : false),
                updatedAt: new Date().toISOString()
            };
            await setDoc(docRef, payload, { merge: true });
        };

        window.processSmartInput = async function() {
            const textEl = document.getElementById('smartInput');
            const text = textEl ? textEl.value.trim() : "";
            if (!text) return;
            const loader = document.getElementById('ai-loading');
            if(loader) loader.classList.remove('hidden');

            const prompt = `CRM 분석가로서 다음 문장에서 {name, phone, product, notes}를 추출해 JSON 배열 [{...}]로 답해줘. 8자리 번호면 010을 붙여. 텍스트: "${text}"`;
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const result = await res.json();
                const raw = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const jsonMatch = raw.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                    const items = JSON.parse(jsonMatch[0]);
                    for (const item of items) { if (item.name || item.phone) await window.smartSaveOrUpdate({ ...item, category: '미연락' }); }
                }
            } catch (e) { alert("AI 분석 실패. 직접 입력을 이용해 주세요."); }
            if(loader) loader.classList.add('hidden');
            if(textEl) textEl.value = "";
            window.closeModal();
        };

        window.startVoiceToSmart = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("음성 인식이 지원되지 않습니다.");
            const rec = new SpeechRecognition();
            rec.lang = 'ko-KR';
            rec.onresult = (e) => { 
                const el = document.getElementById('smartInput');
                if(el) el.value = e.results[0][0].transcript; 
                window.processSmartInput(); 
            };
            rec.start();
        };

        // 5. 렌더링 엔진 (에러 방어 및 실시간 통계)
        window.render = function() {
            if (!isAppReady) return;
            const container = document.getElementById('customerList');
            const searchEl = document.getElementById('searchInput');
            if (!container || !searchEl) return;

            const search = searchEl.value.toLowerCase();
            const sortMode = document.getElementById('sortFilter').value;
            
            // 실시간 통계 계산
            document.getElementById('stat-미연락').innerText = customers.filter(c => c.category === '미연락').length;
            document.getElementById('stat-상담진행').innerText = customers.filter(c => c.category === '상담진행').length;
            document.getElementById('stat-사은품').innerText = customers.filter(c => c.category === '사은품').length;
            document.getElementById('stat-urgent').innerText = customers.filter(c => c.isUrgent === true).length;

            let filtered = currentCategory === '전체' ? customers : 
                           (currentCategory === '긴급' ? customers.filter(c => c.isUrgent === true) : 
                           customers.filter(c => c.category === currentCategory));

            filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search) || (c.phone || '').includes(search) || (c.product || '').toLowerCase().includes(search));

            filtered.sort((a, b) => {
                const aU = a.isUrgent === true ? 0 : 1; const bU = b.isUrgent === true ? 0 : 1;
                if (aU !== bU) return aU - bU;
                if (sortMode === 'product') return (a.product || '미지정').localeCompare(b.product || '미지정');
                if (sortMode === 'update') return new Date(b.updatedAt) - new Date(a.updatedAt);
                return (a.name || '').localeCompare(b.name || '');
            });

            document.getElementById('totalBadge').innerText = `${filtered.length} 명`;
            container.innerHTML = '';

            filtered.forEach(c => {
                const isUrgent = c.isUrgent === true;
                const cOpts = categories.map(cat => `<option value="${cat}" ${c.category === cat ? 'selected' : ''}>${cat}</option>`).join('');
                const pOpts = products.map(p => `<option value="${p}" ${c.product === p ? 'selected' : ''}>${p}</option>`).join('');

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-[28px] border ${isUrgent ? 'urgent-card' : 'border-slate-100'} shadow-sm transition-all active:scale-[0.99]">
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-left flex-1 overflow-hidden">
                                <h4 class="font-black text-slate-800 text-lg truncate">${c.name} ${isUrgent ? '<i class="fa-solid fa-fire-flame-curved text-red-500 ml-1 animate-pulse"></i>' : ''}</h4>
                                <p class="text-[11px] font-bold text-slate-300 font-mono tracking-tight">${c.phone || '번호없음'}</p>
                            </div>
                            <div class="flex items-center gap-1.5 ml-2">
                                <button onclick="window.toggleUrgent('${c.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-[10px] shadow-sm transition-all ${isUrgent ? 'urgent-btn-active' : 'bg-slate-50 text-slate-400'}"><i class="fa-solid fa-bell"></i></button>
                                <select onchange="window.fastUpdate('${c.id}', 'category', this.value)" class="direct-select">${cOpts}</select>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-3 items-center text-[8px] font-black text-slate-400 uppercase">
                            <select onchange="window.fastUpdate('${c.id}', 'product', this.value)" class="direct-select product-select">${pOpts}</select>
                            <span><i class="fa-solid fa-clock ml-2"></i> ${new Date(c.updatedAt).toLocaleDateString()}</span>
                        </div>
                        <div class="memo-box mb-4 shadow-inner">
                            <textarea class="w-full bg-transparent border-none outline-none resize-none font-semibold text-sm text-slate-600 leading-relaxed" onblur="window.fastUpdate('${c.id}', 'notes', this.value)" placeholder="메모가 없습니다..." rows="2">${c.notes || ''}</textarea>
                        </div>
                        <div class="flex gap-2">
                            <a href="tel:${c.phone}" class="flex-1 h-11 bg-slate-900 text-white rounded-xl flex items-center justify-center gap-2 font-black text-xs no-underline shadow-md active:scale-95 transition-all"><i class="fa-solid fa-phone"></i> 통화</a>
                            <a href="sms:${c.phone}" class="flex-1 h-11 bg-white border border-slate-200 text-slate-800 rounded-xl flex items-center justify-center gap-2 font-black text-xs active-scale-95 transition-all shadow-sm"><i class="fa-solid fa-message text-slate-400"></i> 문자</a>
                            <button onclick="window.editCustomer('${c.id}')" class="flex-1 h-11 bg-slate-50 text-slate-400 rounded-xl flex items-center justify-center active:scale-95"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="window.requestDelete('${c.id}')" class="flex-1 h-11 bg-slate-50 text-slate-300 rounded-xl flex items-center justify-center active-scale-95 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        // 6. UI 핸들러
        window.fastUpdate = async (id, field, value) => {
            if (!auth.currentUser) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), { [field]: value, updatedAt: new Date().toISOString() }, { merge: true });
        };
        window.toggleUrgent = async (id) => { const c = customers.find(item => item.id === id); if (c) await window.fastUpdate(id, 'isUrgent', !c.isUrgent); };
        window.saveCustomer = async function() { 
            const n = document.getElementById('formName').value; const p = document.getElementById('formPhone').value;
            if (!n || !p) return alert('성함과 연락처 필수'); 
            await window.smartSaveOrUpdate({ name: n.trim(), phone: p.trim(), category: document.getElementById('formCategory').value, product: document.getElementById('formProduct').value, notes: document.getElementById('formNotes').value }); 
            window.closeModal(); 
        };
        window.requestDelete = (id) => { deletingId = id; const el = document.getElementById('deleteModal'); if(el){ el.classList.remove('hidden'); el.classList.add('flex'); } document.getElementById('confirmDeleteBtn').onclick = async () => { if (auth?.currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', deletingId)); window.closeDeleteModal(); }; };
        window.closeDeleteModal = () => { const el = document.getElementById('deleteModal'); if(el) el.classList.add('hidden'); deletingId = null; };
        window.setCategory = (cat) => { currentCategory = cat; document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive'); document.getElementById(`tab-${cat}`).className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-active'; window.render(); };
        window.openModal = function() { const el = document.getElementById('modal'); if(el){ el.classList.remove('hidden'); el.classList.add('flex'); } };
        window.closeModal = function() { const el = document.getElementById('modal'); if(el) el.classList.add('hidden'); editingId = null; ['formName', 'formPhone', 'formNotes'].forEach(id => { const val = document.getElementById(id); if(val) val.value=''; }); };
        window.editCustomer = function(id) { const c = customers.find(item => item.id === id); if (!c) return; editingId = id; window.openModal(); document.getElementById('formName').value = c.name; document.getElementById('formPhone').value = c.phone; document.getElementById('formProduct').value = c.product; document.getElementById('formNotes').value = c.notes; document.getElementById('formCategory').value = c.category; };
    </script>
</body>
</html>
