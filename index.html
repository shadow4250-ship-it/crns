<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM Pro Compact</title>
    <!-- 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .bg-blur { backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.9); }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 테마 색상 */
        .theme-전체 { --theme-color: #475569; --theme-bg: #f1f5f9; }
        .theme-긴급 { --theme-color: #ef4444; --theme-bg: #fef2f2; }
        .theme-연락 { --theme-color: #3b82f6; --theme-bg: #eff6ff; }
        .theme-구매 { --theme-color: #10b981; --theme-bg: #f0fdf4; }
        .theme-사은품 { --theme-color: #f59e0b; --theme-bg: #fffbeb; }
        
        .tab-active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); font-weight: 900; }
        .tab-inactive { color: #94a3b8; border-bottom: 3px solid transparent; }

        /* 완료된 카드 스타일 (밑줄/블러 완전 제거) */
        .card-completed { border-color: #f1f5f9 !important; background-color: #fafafa !important; opacity: 1 !important; filter: none !important; }
        .text-completed { color: #94a3b8 !important; text-decoration: none !important; }
        
        /* 콤팩트 UI 최적화 */
        .image-preview-card { width: 100%; height: 110px; object-fit: cover; border-radius: 16px; margin-bottom: 8px; border: 1px solid #f1f5f9; }
        .inline-notes { width: 100%; background: transparent; border: none; outline: none; resize: none; font-style: italic; font-weight: 600; line-height: 1.4; color: #475569; font-size: 13px; }
        .inline-notes:focus { color: #000; background: #fff; padding: 2px; border-radius: 4px; }
        .product-select { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 99px; padding: 2px 8px; font-size: 9px; font-weight: 800; color: #64748b; appearance: none; outline: none; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 select-none theme-전체" id="mainBody">

    <!-- 로딩 화면 -->
    <div id="loading-screen" class="fixed inset-0 z-[200] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="w-10 h-10 border-4 border-slate-100 border-t-slate-900 rounded-full loading-spin mb-4"></div>
        <p class="text-slate-500 font-black text-[10px] uppercase tracking-widest text-center">CRM Pro Loading...</p>
    </div>

    <!-- 헤더 -->
    <header class="sticky top-0 z-40 bg-blur border-b border-slate-100 p-3 px-5 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 bg-slate-900 text-white rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-crown text-[12px] text-yellow-400"></i>
            </div>
            <h1 class="text-lg font-black tracking-tighter text-slate-800 italic uppercase">CRM Pro</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="startSmartVoice()" class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg active-scale">
                <i class="fa-solid fa-microphone text-sm"></i>
            </button>
            <button onclick="openModal()" class="bg-slate-900 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg active-scale">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
        </div>
    </header>

    <!-- 탭 메뉴 -->
    <nav class="sticky top-[57px] z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 flex shadow-sm overflow-x-auto no-scrollbar">
        <button onclick="setCategory('전체')" id="tab-전체" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-active">전체</button>
        <button onclick="setCategory('긴급')" id="tab-긴급" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">긴급 관리</button>
        <button onclick="setCategory('연락')" id="tab-연락" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">연락 관리</button>
        <button onclick="setCategory('구매')" id="tab-구매" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">구매/결제</button>
        <button onclick="setCategory('사은품')" id="tab-사은품" class="flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive">사은품/증정</button>
    </nav>

    <main class="max-w-xl mx-auto p-3 space-y-4">
        <!-- 긴급 알림 배너 -->
        <div id="urgentContainer" class="hidden bg-slate-900 text-white rounded-[24px] p-4 shadow-xl animate-in fade-in slide-in-from-top-4">
            <div class="flex items-center gap-3 mb-3">
                <i class="fa-solid fa-fire-flame-curved text-red-400 animate-pulse"></i>
                <p class="text-sm font-black italic">오늘 즉시 처리 <span id="urgentCount" class="text-red-400">0</span>명</p>
            </div>
            <div id="urgentList" class="space-y-2"></div>
        </div>

        <!-- 검색바 -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
            <input type="text" id="searchInput" oninput="render()" placeholder="성함, 번호, 품목 검색..." 
                class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-[20px] focus:outline-none shadow-sm text-sm font-bold">
        </div>
        
        <!-- 필터 영역 -->
        <div class="flex items-center justify-between px-1">
            <div class="flex gap-1.5 flex-1 overflow-x-auto no-scrollbar">
                <select id="sortFilter" onchange="render()" class="bg-white border border-slate-200 rounded-full px-3 py-2 text-[10px] font-black text-slate-600 outline-none shadow-sm flex-none">
                    <option value="update">최신순</option>
                    <option value="contact">예정일순</option>
                    <option value="name">이름순</option>
                </select>
                <select id="productFilter" onchange="render()" class="bg-white border border-slate-200 rounded-full px-3 py-2 text-[10px] font-black text-blue-600 outline-none shadow-sm flex-none">
                    <option value="all">품목:전체</option>
                    <option value="티비">티비</option>
                    <option value="냉장고">냉장고</option>
                    <option value="에어컨">에어컨</option>
                    <option value="혼수">혼수</option>
                    <option value="인덕션">인덕션</option>
                    <option value="식기세척기">식세기</option>
                    <option value="김치냉장고">김냉</option>
                </select>
            </div>
            <span id="totalBadge" class="text-[9px] font-black text-slate-400 uppercase tracking-tighter bg-white border border-slate-100 px-3 py-2 rounded-full ml-2 flex-none">0 명</span>
        </div>

        <div id="customerList" class="space-y-3"></div>
    </main>

    <!-- 입력 모달 -->
    <div id="modal" class="fixed inset-0 z-[110] bg-white hidden flex-col animate-in slide-in-from-bottom duration-300">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
            <button onclick="closeModal()" class="p-2 text-slate-400 active-scale"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h2 id="modalTitle" class="font-black text-base text-slate-800 italic uppercase">데이터 편집</h2>
            <button onclick="saveCustomer()" class="text-blue-600 font-black px-4 text-lg active-scale">저장</button>
        </div>
        <div class="p-5 space-y-5 overflow-y-auto pb-60 no-scrollbar">
            <!-- 스마트 입력 엔진 -->
            <div class="bg-blue-50 p-5 rounded-[24px] border border-blue-100 space-y-3 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] font-black text-blue-600 uppercase tracking-widest"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 멀티 등록/OCR</label>
                    <span id="ai-loading" class="hidden text-[9px] font-bold text-blue-400 animate-pulse">분석 중...</span>
                </div>
                <textarea id="aiInput" class="w-full p-4 bg-white border border-blue-100 rounded-[20px] text-sm font-bold outline-none h-24" placeholder="예: 홍길동 12345678 냉장고"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="document.getElementById('photoInputOCR').click()" class="bg-white border-2 border-blue-200 text-blue-500 rounded-xl py-3 text-xs font-black active-scale flex items-center justify-center gap-1">
                        <i class="fa-solid fa-camera"></i> 사진 분석
                    </button>
                    <button onclick="smartParseAction()" class="bg-blue-600 text-white rounded-xl py-3 text-xs font-black shadow-lg active-scale">멀티 등록</button>
                    <input type="file" id="photoInputOCR" accept="image/*" class="hidden" onchange="handleImageRecognition(this)">
                </div>
            </div>

            <!-- 정보 필드 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">성함</label>
                    <input id="formName" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-black text-sm outline-none focus:bg-white shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">단계</label>
                    <select id="formCategory" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm appearance-none outline-none shadow-sm bg-white">
                        <option value="긴급">긴급 관리</option>
                        <option value="연락">연락 관리</option>
                        <option value="구매">구매/결제</option>
                        <option value="사은품">사은품/증정</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">품목</label>
                    <select id="formProduct" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm appearance-none bg-white shadow-sm">
                        <option value="미지정">미지정</option>
                        <option value="티비">티비</option>
                        <option value="냉장고">냉장고</option>
                        <option value="에어컨">에어컨</option>
                        <option value="혼수">혼수 가전</option>
                        <option value="인덕션">인덕션</option>
                        <option value="식기세척기">식세기</option>
                        <option value="김치냉장고">김냉</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">연락처</label>
                    <input id="formPhone" type="tel" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none focus:bg-white shadow-sm" placeholder="번호 입력">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-red-500 ml-1 uppercase">연락 예정일</label>
                    <input type="date" id="formDate" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none shadow-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">사진 첨부</label>
                    <button onclick="document.getElementById('photoInput').click()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-400 active-scale">사진 추가</button>
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="previewImage(this)">
                </div>
            </div>

            <div id="imageArea" class="hidden relative">
                <img id="formImagePreview" src="" class="w-full h-40 object-cover rounded-xl border border-slate-100 shadow-sm">
                <button onclick="removeImage()" class="absolute top-2 right-2 w-7 h-7 bg-black/50 text-white rounded-full flex items-center justify-center active-scale"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-1">
                <label class="text-[9px] font-black text-slate-400 ml-1 uppercase tracking-widest">상담 메모</label>
                <textarea id="formNotes" rows="6" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm italic resize-none outline-none focus:bg-white shadow-inner" placeholder="내용 입력..."></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
            <button onclick="saveCustomer()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black shadow-lg active-scale">데이터 저장</button>
        </div>
    </div>

    <!-- 음성 안내 -->
    <div id="voiceOverlay" class="fixed inset-0 z-[250] bg-slate-900/95 backdrop-blur-2xl hidden flex flex-col items-center justify-center text-white p-10 text-center animate-in fade-in duration-300">
        <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mb-6 animate-pulse border-2 border-white/20 shadow-[0_0_50px_rgba(239,68,68,0.2)]">
            <i class="fa-solid fa-microphone text-4xl text-red-500"></i>
        </div>
        <p class="text-xl font-black italic uppercase tracking-tighter">듣고 있습니다</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. 설정
        const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":""}';
        const firebaseConfig = JSON.parse(configStr);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'park-crm-v55-compact';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const apiKey = "";
        
        let db, auth;
        let customers = [];
        let editingId = null;
        let currentUser = null;
        let currentCategory = '전체';
        let currentImageData = "";

        const products = ['미지정', '티비', '냉장고', '에어컨', '혼수', '인덕션', '식기세척기', '김치냉장고'];

        // 명단 10인방 복구 데이터
        const recoveryList = [
            { name: '에어컨 신규', phone: '010-2985-0955', category: '긴급', product: '에어컨', notes: '시스템에어컨 희망 / 5월 15일까지 연락 필수', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '조수진', phone: '010-4416-8488', category: '구매', product: '혼수', notes: '혼수 가전 상담 / 박정근 담당', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '김민규', phone: '010-2646-7785', category: '연락', product: '에어컨', notes: '이사 가전 상담 / 박정근 담당', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '최진우', phone: '010-3814-7221', category: '연락', product: '티비', notes: '75인치 이상 모델 문의', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '장성필', phone: '010-4553-6113', category: '구매', product: '냉장고', notes: '키친핏 모델 견적 요청', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '임수정', phone: '010-2521-5006', category: '사은품', product: '미지정', notes: '사은품 수령지 확인 중', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '박정권', phone: '010-9107-5798', category: '연락', product: '미지정', notes: '주요 상담 고객님', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '차은주', phone: '010-4875-9936', category: '연락', product: '식기세척기', notes: '빌트인 설치 가능 여부 확인', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '최나임', phone: '010-3091-4080', category: '사은품', product: '인덕션', notes: '구조 확인 완료', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() },
            { name: '박정근(담당)', phone: '010-0000-0000', category: '긴급', product: '미지정', notes: '시스템 관리자', updatedAt: new Date().toISOString(), isCompleted: false, registeredAt: new Date().toISOString() }
        ];

        const hideLoader = () => { const loader = document.getElementById('loading-screen'); if(loader) loader.style.display = 'none'; };
        const formatPhone = (val) => {
            if (!val) return '';
            let num = val.toString().replace(/[^0-9]/g, '');
            if (num.length === 8) num = '010' + num;
            if (num.length === 11) return num.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            return val;
        };

        const checkThreeMonths = (updatedAt) => {
            if (!updatedAt) return false;
            const updateDate = new Date(updatedAt);
            const threeMonthsAgo = new Date();
            threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
            return updateDate < threeMonthsAgo;
        };

        // 3. 데이터 로직 (인라인 수정)
        window.fastUpdate = async (id, field, value) => {
            const ts = new Date().toISOString();
            if (db && currentUser) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), { [field]: value, updatedAt: ts }, { merge: true });
            } else {
                const idx = customers.findIndex(c => c.id === id);
                if (idx !== -1) { customers[idx][field] = value; customers[idx].updatedAt = ts; saveToStorage(); render(); }
            }
        };

        const smartSaveOrUpdate = async (data) => {
            const cleanPhone = formatPhone(data.phone);
            const existing = customers.find(c => formatPhone(c.phone) === cleanPhone && cleanPhone !== "");
            const ts = new Date().toISOString();
            
            if (existing && !editingId) {
                const combinedNotes = `[${new Date().toLocaleDateString()}] ${data.notes}\n---\n${existing.notes || ''}`;
                const updateData = { notes: combinedNotes, updatedAt: ts, isCompleted: false };
                if (db && currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', existing.id), updateData, { merge: true });
                else { const idx = customers.findIndex(item => item.id === existing.id); if (idx !== -1) { customers[idx] = {...customers[idx], ...updateData}; saveToStorage(); render(); } }
            } else {
                const targetId = editingId || (Date.now().toString() + Math.random().toString(36).substr(2, 4));
                const entry = { ...data, phone: cleanPhone, updatedAt: ts, registeredAt: editingId ? (customers.find(c => c.id === editingId)?.registeredAt || ts) : ts };
                if (db && currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', targetId), entry, { merge: true });
                else { 
                    if (editingId) { const idx = customers.findIndex(item => item.id === editingId); if (idx !== -1) customers[idx] = entry; }
                    else { customers.unshift({ id: targetId, ...entry }); }
                    saveToStorage(); render();
                }
            }
        };

        // 4. 초기화 및 동기화 (Rule 3)
        const init = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                setTimeout(() => { if(!currentUser) useLocalStorage(); }, 4000);

                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) { currentUser = user; startFirestoreSync(); }
                    else useLocalStorage();
                });
            } catch (e) { useLocalStorage(); }
        };

        const startFirestoreSync = () => {
            if (!currentUser || !db) return;
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
            onSnapshot(ref, async (snapshot) => {
                if (snapshot.empty) {
                    for (const item of recoveryList) {
                        const id = Date.now().toString() + Math.random().toString(36).substr(2, 4);
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), item);
                    }
                } else {
                    customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                }
                hideLoader();
            }, (err) => { useLocalStorage(); });
        };

        const useLocalStorage = () => { customers = JSON.parse(localStorage.getItem('crm_compact_v1')) || recoveryList; render(); hideLoader(); };
        const saveToStorage = () => localStorage.setItem('crm_compact_v1', JSON.stringify(customers));

        // 5. 렌더링 (요청 사항: 연락 탭 체크박스 복구 및 시각적 효과 제거)
        window.render = function() {
            const container = document.getElementById('customerList'); if (!container) return;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortFilter').value;
            const productFilter = document.getElementById('productFilter').value;
            const today = new Date().toISOString().split('T')[0];
            
            let filtered = customers;
            if (currentCategory !== '전체') filtered = filtered.filter(c => (c.category || '연락') === currentCategory);

            filtered = filtered.filter(c => 
                (c.name || '').toLowerCase().includes(search) || 
                (c.phone || '').includes(search) ||
                (c.product || '').toLowerCase().includes(search)
            );
            
            if (productFilter !== 'all') filtered = filtered.filter(c => (c.product || '미지정') === productFilter);

            filtered.sort((a, b) => {
                if (a.isCompleted && !b.isCompleted) return 1;
                if (!a.isCompleted && b.isCompleted) return -1;
                if (sortMode === 'update') return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
                if (sortMode === 'contact') return new Date(a.nextContactDate || '9999-12-31') - new Date(b.nextContactDate || '9999-12-31');
                if (sortMode === 'name') return (a.name || '').localeCompare(b.name || '');
                return 0;
            });

            // 긴급 건 알림
            const urgents = customers.filter(c => !c.isCompleted && (c.category === '긴급' || (c.nextContactDate === today)));
            const urgentContainer = document.getElementById('urgentContainer');
            if (urgents.length > 0) {
                urgentContainer.classList.remove('hidden');
                document.getElementById('urgentCount').innerText = urgents.length;
                document.getElementById('urgentList').innerHTML = urgents.slice(0, 2).map(c => `
                    <div class="flex items-center justify-between bg-white/10 p-2 rounded-xl border border-white/10 text-xs">
                        <span class="font-bold ml-1">${c.name}</span>
                        <a href="tel:${c.phone?.replace(/[^0-9]/g,'')}" class="p-1.5"><i class="fa-solid fa-phone"></i></a>
                    </div>
                `).join('');
            } else urgentContainer.classList.add('hidden');

            document.getElementById('totalBadge').innerText = `${filtered.length} 명`;
            container.innerHTML = '';

            filtered.forEach(c => {
                const isLateUrgent = !c.isCompleted && (c.category === '긴급' || (c.nextContactDate && c.nextContactDate <= today));
                const isOld = checkThreeMonths(c.updatedAt);
                const cleanPhone = (c.phone || '').replace(/[^0-9]/g,'');
                const productOptions = products.map(p => `<option value="${p}" ${c.product === p ? 'selected' : ''}>${p}</option>`).join('');

                // [요청 사항] '연락 관리'와 '긴급' 탭에 체크박스 표시
                const showCheckbox = currentCategory === '연락' || currentCategory === '긴급' || c.category === '연락' || c.category === '긴급';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-[32px] border ${isLateUrgent ? 'border-red-100 ring-2 ring-red-50' : 'border-slate-50'} shadow-sm active:scale-[0.99] transition-all ${c.isCompleted ? 'card-completed' : ''}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                ${ showCheckbox ? `
                                <button onclick="toggleComplete('${c.id}', event)" class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${c.isCompleted ? 'bg-green-500 border-green-500 text-white shadow-sm' : 'border-slate-100 text-transparent'}">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </button>` : '' }
                                <div>
                                    <h4 class="font-black text-slate-800 text-base leading-tight flex items-center gap-1.5 ${c.isCompleted ? 'text-completed' : ''}">
                                        ${c.name} ${isLateUrgent ? '<span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span>' : ''}
                                    </h4>
                                    <p class="text-[11px] font-bold text-slate-300 font-mono">${formatPhone(c.phone || 'no phone')}</p>
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <select onchange="fastUpdate('${c.id}', 'product', this.value)" class="product-select">
                                    ${productOptions}
                                </select>
                                <span class="text-[8px] font-black text-slate-200 uppercase">${c.category || '연락'}</span>
                            </div>
                        </div>

                        ${c.imageData ? `<img src="${c.imageData}" class="image-preview-card" onclick="window.open('${c.imageData}')">` : ''}

                        <div class="flex flex-wrap gap-2 mb-3 items-center">
                            ${isOld ? `<span class="text-[8px] font-black bg-slate-900 text-white px-2 py-0.5 rounded-full uppercase">삭제대기</span>` : ''}
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter"><i class="fa-solid fa-clock mr-1"></i> 수정: ${new Date(c.updatedAt || Date.now()).toLocaleDateString()}</span>
                            ${c.nextContactDate ? `<span class="text-[9px] font-black ${isLateUrgent ? 'text-red-500' : 'text-slate-400'} bg-slate-50 px-2 py-0.5 rounded-full">${c.nextContactDate}</span>` : ''}
                        </div>

                        <div class="bg-slate-50/50 rounded-2xl p-3.5 mb-4 border border-slate-50 shadow-inner overflow-hidden">
                            <textarea 
                                class="inline-notes ${c.isCompleted ? 'text-completed' : ''}" 
                                onblur="fastUpdate('${c.id}', 'notes', this.value)"
                                placeholder="메모 입력..."
                                rows="2"
                            >${c.notes || ''}</textarea>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <a href="tel:${cleanPhone}" class="flex-[3] h-12 bg-slate-900 text-white rounded-xl flex items-center justify-center gap-2 font-black text-xs active-scale no-underline transition-transform">
                                <i class="fa-solid fa-phone"></i> 전화
                            </a>
                            <a href="sms:${cleanPhone}" class="flex-[3] h-12 bg-white border-2 border-slate-200 text-slate-800 rounded-xl flex items-center justify-center gap-2 font-black text-xs active-scale no-underline shadow-sm">
                                <i class="fa-solid fa-message text-slate-400"></i> 문자
                            </a>
                            <button onclick="editCustomer('${c.id}')" class="flex-1 h-12 bg-slate-50 text-slate-500 rounded-xl flex items-center justify-center active-scale transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteCustomer('${c.id}')" class="flex-1 h-12 bg-slate-50 text-slate-300 rounded-xl flex items-center justify-center active-scale hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        // 6. 핸들러
        window.toggleComplete = async (id, e) => {
            e.stopPropagation();
            const c = customers.find(item => item.id === id);
            if (!c) return;
            const ts = new Date().toISOString();
            // 긴급에서 완료 시 '연락'으로 이동하며 선명하게 리셋, 연락 탭에서는 일반 토글
            let updates = {};
            if (c.category === '긴급') {
                updates = { category: '연락', isCompleted: false, updatedAt: ts };
            } else {
                updates = { isCompleted: !c.isCompleted, updatedAt: ts };
            }

            if (db && currentUser) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), updates, { merge: true });
            else { const idx = customers.findIndex(item => item.id === id); if (idx !== -1) { customers[idx] = {...customers[idx], ...updates}; saveToStorage(); render(); } }
        };

        window.deleteCustomer = async function(id) { 
            const c = customers.find(item => item.id === id); 
            if (c.category === '긴급' && !c.isCompleted) return alert("긴급 건은 완료 처리 후 삭제 가능합니다.");
            if (confirm('삭제하시겠습니까?')) { 
                if (db && currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id)); 
                else { customers = customers.filter(item => item.id !== id); saveToStorage(); render(); } 
            } 
        };

        window.saveCustomer = async function() {
            const name = document.getElementById('formName').value; let phone = document.getElementById('formPhone').value; const product = document.getElementById('formProduct').value; const notes = document.getElementById('formNotes').value; const cat = document.getElementById('formCategory').value; const date = document.getElementById('formDate').value;
            if (!name || !phone) return alert('성함과 연락처 필수');
            await smartSaveOrUpdate({ name, phone, product, notes, category: cat, nextContactDate: date });
            closeModal();
        };

        window.smartParseAction = async function() {
            const input = document.getElementById('aiInput').value.trim();
            if (!input) return;
            const items = input.split(/[\n,;]+/).filter(l => l.trim().length > 1);
            for (const item of items) {
                const dateMatch = item.match(/\d{4}-\d{2}-\d{2}/) || item.match(/\d{8}/);
                let extDate = dateMatch ? (dateMatch[0].includes('-') ? dateMatch[0] : dateMatch[0].replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')) : "";
                const phoneMatch = item.match(/\d{8,11}/);
                let extPhone = phoneMatch ? formatPhone(phoneMatch[0]) : "";
                let extCat = item.includes('긴급') ? '긴급' : '연락';
                let extProduct = '미지정';
                for (const p of products) { if (item.includes(p)) { extProduct = p; break; } }
                let clean = item.replace(extDate, "").replace(phoneMatch ? phoneMatch[0] : "", "").replace(/긴급|구매|결제|사은품|증정|연락/g, "").trim();
                let words = clean.split(/[\s]+/);
                await smartSaveOrUpdate({ name: words[0] || "신규 고객", phone: extPhone, category: extCat, product: extProduct, notes: words.slice(1).join(" "), nextContactDate: extDate });
            }
            closeModal(); document.getElementById('aiInput').value = "";
        };

        window.handleImageRecognition = async function(input) {
            const file = input.files[0]; if (!file) return;
            const loader = document.getElementById('ai-loading'); loader.classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                const prompt = "이미지에서 {name, phone, notes} 추출 JSON 배열로만 응답하세요.";
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }] })
                    });
                    const result = await res.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const jsonMatch = text.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        const extracted = JSON.parse(jsonMatch[0]);
                        for (const item of extracted) await smartSaveOrUpdate({ ...item, category: '연락', product: '미지정', nextContactDate: '' });
                    }
                } finally { loader.classList.add('hidden'); }
            };
            reader.readAsDataURL(file);
        };

        window.setCategory = (cat) => { currentCategory = cat; document.getElementById('mainBody').className = `bg-slate-50 text-slate-900 pb-32 select-none theme-${cat}`; document.querySelectorAll('nav button').forEach(btn => btn.className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-inactive'); document.getElementById(`tab-${cat}`).className = 'flex-none px-5 py-4 text-xs tracking-tighter transition-all tab-active'; render(); };
        window.openModal = function() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); document.getElementById('formCategory').value = currentCategory === '전체' ? '연락' : currentCategory; removeImage(); };
        window.closeModal = function() { document.getElementById('modal').classList.add('hidden'); editingId = null; ['formName', 'formPhone', 'formNotes', 'formDate', 'formDeliveryDate', 'aiInput'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; }); removeImage(); };
        window.editCustomer = function(id) {
            const c = customers.find(item => item.id === id); if (!c) return;
            editingId = id; openModal();
            document.getElementById('formName').value = c.name || ''; document.getElementById('formPhone').value = c.phone || ''; document.getElementById('formProduct').value = c.product || '미지정'; document.getElementById('formNotes').value = c.notes || ''; document.getElementById('formCategory').value = c.category || '연락'; document.getElementById('formDate').value = c.nextContactDate || '';
            if (c.imageData) { currentImageData = c.imageData; document.getElementById('formImagePreview').src = c.imageData; document.getElementById('imageArea').classList.remove('hidden'); }
        };
        window.previewImage = function(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { currentImageData = e.target.result; document.getElementById('formImagePreview').src = currentImageData; document.getElementById('imageArea').classList.remove('hidden'); }; reader.readAsDataURL(file); };
        window.removeImage = () => { currentImageData = ""; document.getElementById('imageArea').classList.add('hidden'); document.getElementById('photoInput').value = ""; };
        window.startVoice = (id) => { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRecognition) return; const rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.onstart = () => document.getElementById('voiceOverlay').classList.remove('hidden'); rec.onend = () => document.getElementById('voiceOverlay').classList.add('hidden'); rec.onresult = (e) => { document.getElementById(id).value += (document.getElementById(id).value ? ' ' : '') + e.results[0][0].transcript; }; rec.start(); };
        window.startSmartVoice = () => { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRecognition) return alert("미지원"); const rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.onstart = () => document.getElementById('voiceOverlay').classList.remove('hidden'); rec.onend = () => { document.getElementById('voiceOverlay').classList.add('hidden'); setTimeout(() => smartParseAction(), 500); }; rec.onresult = (e) => { openModal(); document.getElementById('aiInput').value = e.results[0][0].transcript; }; rec.start(); };

        init();
    </script>
</body>
</html>
