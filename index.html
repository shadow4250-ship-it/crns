<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM Pro v15.0 (견적관리 탭 에디션)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        
        .theme-전체 { --theme-color: #475569; }
        .theme-긴급 { --theme-color: #ef4444; }
        .theme-미연락 { --theme-color: #f59e0b; }
        .theme-상담진행 { --theme-color: #3b82f6; }
        .theme-사은품 { --theme-color: #10b981; }
        .theme-견적관리 { --theme-color: #8b5cf6; }
        
        .tab-active { color: var(--theme-color); border-bottom: 3px solid var(--theme-color); font-weight: 900; }
        .tab-inactive { color: #cbd5e1; border-bottom: 3px solid transparent; }

        .category-quick-select { 
            background: #f1f5f9; border-radius: 8px; padding: 4px 8px; font-weight: 800; 
            color: #475569; appearance: none; outline: none; border: 1px solid #e2e8f0; 
            text-align: center; font-size: 11px; cursor: pointer;
        }

        .urgent-card { border: 2.5px solid #ef4444 !important; background-color: #fffafb !important; box-shadow: 0 12px 28px rgba(239, 68, 68, 0.18); }
        .urgent-tag { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; margin-right: 4px; }
        
        .memo-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); text-align: left; overflow: hidden; transition: all 0.2s; }
        .memo-box:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); background: #fff; }
        
        #save-toast { display: none; position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 24px; border-radius: 50px; z-index: 500; font-size: 12px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        .photo-preview { width: 100%; height: 160px; object-fit: cover; border-radius: 16px; margin-top: 8px; display: none; border: 1px solid #e2e8f0; }
        .card-photo { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; border: 1px solid #f1f5f9; cursor: pointer; }
    </style>
</head>
<body class="pb-24 select-none theme-전체">

    <div id="save-toast">실시간 동기화 완료</div>

    <!-- [1] Firebase 이메일 인증 화면 -->
    <div id="lock-screen" class="fixed inset-0 z-[300] bg-white flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-[320px] text-center space-y-8">
            <div class="space-y-2">
                <h1 class="text-5xl font-black tracking-tighter text-slate-900 uppercase italic">CRM</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em]">MegaStore Ulsan Edition</p>
            </div>
            <form onsubmit="event.preventDefault(); window.loginCRM();" class="space-y-3">
                <input type="email" id="loginEmail" autocomplete="username" required
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 focus:bg-white text-sm" 
                    placeholder="이메일 계정">
                <input type="password" id="loginPassword" autocomplete="current-password" required
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 font-bold outline-none focus:border-blue-500 focus:bg-white text-sm" 
                    placeholder="비밀번호">
                <button type="submit" id="loginBtn"
                    class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black active-scale shadow-xl text-base uppercase tracking-wider">
                    로그인
                </button>
            </form>
            <p id="login-error" class="hidden text-red-500 text-xs font-bold animate-pulse"></p>
        </div>
    </div>

    <!-- [2] 메인 앱 영역 -->
    <div id="main-app" class="hidden">
        <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 p-4 px-5 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-red-600 text-white rounded-lg flex items-center justify-center font-black italic shadow-md">H</div>
                <div>
                    <h1 class="text-base font-black tracking-tight text-slate-900 leading-tight">하이마트 울산점 CRM</h1>
                    <p class="text-[8px] font-bold text-slate-400">매니저 박정근 전용 견적 시스템</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.logoutCRM()" title="로그아웃" class="w-8 h-8 bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center active-scale">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                </button>
                <button onclick="window.openModal()" class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center shadow-lg active-scale">
                    <i class="fa-solid fa-plus text-lg"></i>
                </button>
            </div>
        </header>

        <!-- 상단 현황 -->
        <div class="px-4 pt-4 flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <div class="bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-purple-600 uppercase tracking-widest">Quotes</p>
                <p id="stat-견적관리" class="text-base font-black text-slate-800">0</p>
            </div>
            <div class="bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-red-500 uppercase tracking-widest">Emergency</p>
                <p id="stat-urgent" class="text-base font-black text-slate-800">0</p>
            </div>
            <div class="bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-orange-500 uppercase tracking-widest">Wait</p>
                <p id="stat-미연락" class="text-base font-black text-slate-800">0</p>
            </div>
            <div class="bg-white border border-slate-100 rounded-2xl p-3 flex-1 min-w-[70px] text-center shadow-sm">
                <p class="text-[7px] font-black text-blue-500 uppercase tracking-widest">Active</p>
                <p id="stat-상담진행" class="text-base font-black text-slate-800">0</p>
            </div>
        </div>

        <!-- 탭 필터 (견적관리 탭 추가) -->
        <nav class="sticky top-[69px] z-30 bg-white border-b border-slate-100 flex shadow-sm overflow-x-auto no-scrollbar">
            <button onclick="window.setCategory('전체')" id="tab-전체" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-active">전체</button>
            <button onclick="window.setCategory('견적관리')" id="tab-견적관리" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive">
                <i class="fa-solid fa-file-invoice-dollar mr-1"></i>견적관리
            </button>
            <button onclick="window.setCategory('긴급')" id="tab-긴급" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive">긴급</button>
            <button onclick="window.setCategory('미연락')" id="tab-미연락" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive">미연락</button>
            <button onclick="window.setCategory('상담진행')" id="tab-상담진행" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive">상담진행</button>
            <button onclick="window.setCategory('사은품')" id="tab-사은품" class="flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive">사은품</button>
        </nav>

        <main class="max-w-xl mx-auto p-3 space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                <input type="text" id="searchInput" oninput="window.render()" placeholder="이름, 번호, 품목 통합 검색..." 
                    class="w-full pl-10 pr-4 py-4 bg-white border border-slate-200 rounded-[20px] focus:outline-none shadow-sm text-sm font-bold">
            </div>
            
            <div class="flex items-center justify-between px-1">
                <select id="sortFilter" onchange="window.render()" class="bg-white border border-slate-200 rounded-full px-3 py-1.5 text-[10px] font-black text-slate-600 outline-none shadow-sm min-w-[100px]">
                    <option value="update">최신 수정순</option>
                    <option value="quotes">견적건수 많은순</option>
                    <option value="product">품목별 정렬</option>
                    <option value="name">이름 가나다순</option>
                </select>
                <span id="totalBadge" class="text-[9px] font-black text-slate-400 bg-white border border-slate-100 px-3 py-1.5 rounded-full shadow-inner flex-none">0 명</span>
            </div>

            <div id="customerList" class="space-y-4 min-h-[500px]"></div>
        </main>
    </div>

    <!-- [3] 상세 입력 모달 (신규/수정) -->
    <div id="modal" class="fixed inset-0 z-[110] bg-white hidden flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
            <button onclick="window.closeModal()" class="p-2 text-slate-400 active-scale"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h2 id="modalTitle" class="font-black text-base text-slate-800 uppercase italic">고객 및 기본 정보</h2>
            <button id="saveBtn" onclick="window.saveCustomer()" class="text-blue-600 font-black px-4 text-lg">완료</button>
        </div>
        <div class="p-5 space-y-5 overflow-y-auto pb-40 no-scrollbar text-left">
            
            <!-- 음성 및 텍스트 자동 분류 -->
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 space-y-2 shadow-sm" id="smartInputContainer">
                <div class="flex justify-between items-center text-blue-600 font-black text-[11px] uppercase tracking-widest">
                    <span><i class="fa-solid fa-bolt mr-1"></i> 음성 / 문장 자동 분류</span>
                    <button onclick="window.startVoiceRecognition()" id="mic-btn" class="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg active-scale">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </button>
                </div>
                <textarea id="smartInput" class="w-full p-3 bg-white border border-blue-100 rounded-xl text-sm font-bold outline-none h-14 shadow-inner" 
                    placeholder="예: 홍길동 01012345678 에어컨" oninput="window.fastKeywordParse()"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">성함</label>
                    <input id="formName" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-black text-base outline-none focus:bg-white shadow-sm" placeholder="고객 성함">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">연락처</label>
                    <input id="formPhone" type="tel" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-base outline-none focus:bg-white shadow-sm" placeholder="연락처">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">대표 품목</label>
                    <select id="formProduct" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm appearance-none shadow-sm">
                        <option value="미지정">미지정</option>
                        <option value="티비">티비</option>
                        <option value="냉장고">냉장고</option>
                        <option value="에어컨">에어컨</option>
                        <option value="혼수 가전">혼수 가전</option>
                        <option value="식기세척기">식기세척기</option>
                        <option value="세탁건조기">세탁건조기</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">예정일 (상담/입주/방문)</label>
                    <input type="date" id="formScheduledDate" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none shadow-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">진행 단계</label>
                <select id="formCategory" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none shadow-sm">
                    <option value="상담진행">상담진행</option>
                    <option value="미연락">미연락</option>
                    <option value="사은품">사은품</option>
                </select>
            </div>

            <!-- 사진 첨부 -->
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">현장/참고 사진</label>
                <div class="flex gap-2 items-center">
                    <label for="formPhoto" class="flex-1 bg-white border-2 border-dashed border-slate-200 rounded-xl p-3 text-center cursor-pointer active-scale shadow-sm">
                        <i class="fa-solid fa-camera text-slate-400 mb-0.5 text-sm"></i>
                        <p class="text-[10px] text-slate-500 font-bold">사진 첨부 (POS/현장)</p>
                    </label>
                    <input type="file" id="formPhoto" accept="image/*" class="hidden" onchange="window.handlePhotoSelect(event)">
                </div>
                <img id="photo-preview-img" class="photo-preview" src="">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 ml-1 uppercase tracking-widest">일반 상담 메모</label>
                <textarea id="formNotes" rows="4" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:bg-white shadow-inner" placeholder="기본 상담 내용..."></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-2xl">
            <button onclick="window.saveCustomer()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black shadow-lg text-base active-scale uppercase tracking-widest">저장하기</button>
        </div>
    </div>

    <!-- [4] 견적 추가 모달 (차수별 누적) -->
    <div id="quoteModal" class="fixed inset-0 z-[120] bg-white hidden flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-purple-50">
            <button onclick="window.closeQuoteModal()" class="p-2 text-purple-600 active-scale"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <div>
                <h2 class="font-black text-base text-purple-950">새 견적 등록</h2>
                <p id="quoteTargetName" class="text-[10px] text-purple-600 font-bold"></p>
            </div>
            <button onclick="window.saveNewQuote()" class="text-purple-600 font-black px-4 text-lg">추가</button>
        </div>
        <div class="p-5 space-y-4 overflow-y-auto pb-40 no-scrollbar text-left">
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">견적 차수</label>
                    <input id="quoteTitle" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-sm outline-none" placeholder="예: 1차 견적, 85인치 변경건">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">최종 체감가</label>
                    <input id="quotePrice" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl font-black text-sm outline-none text-purple-600" placeholder="예: 770만 원">
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-center ml-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">견적서 전문 (Gemini 생성 텍스트 붙여넣기)</label>
                    <button type="button" onclick="window.pasteFromClipboard()" class="text-[10px] font-bold text-purple-600 hover:underline">
                        <i class="fa-regular fa-paste mr-1"></i>클립보드 붙여넣기
                    </button>
                </div>
                <textarea id="quoteContent" rows="12" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-mono font-medium outline-none focus:bg-white shadow-inner leading-relaxed" 
                    placeholder="채팅방에서 Gemini가 생성해준 [가전 구매 견적서] 텍스트를 이곳에 그대로 붙여넣으세요."></textarea>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-2xl">
            <button onclick="window.saveNewQuote()" class="w-full py-4 bg-purple-600 text-white rounded-2xl font-black shadow-lg text-base active-scale uppercase tracking-widest">견적 저장하기</button>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="fixed inset-0 z-[260] bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-6">
        <div class="bg-white w-full max-w-[320px] rounded-[32px] p-8 text-center shadow-2xl">
            <div class="w-14 h-14 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-trash-can text-xl"></i></div>
            <h3 class="text-lg font-black text-slate-800 mb-6">기록을 완전히 삭제할까요?</h3>
            <div class="flex gap-3">
                <button onclick="window.closeDeleteModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-600 rounded-2xl font-black text-xs">취소</button>
                <button id="confirmDeleteBtn" class="flex-1 py-3.5 bg-red-500 text-white rounded-2xl font-black text-xs active-scale">삭제</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgEADFwdp77BNJN-raUvI_H7jOKRtIDM8",
            authDomain: "park-41693.firebaseapp.com",
            projectId: "park-41693",
            storageBucket: "park-41693.firebasestorage.app",
            messagingSenderId: "864597837268",
            appId: "1:864597837268:web:4511defd1695faa6e54241",
            measurementId: "G-TJRBS4XXHP"
        };
        const appId = 'park-crm-inline-v14';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let customers = [];
        let editingId = null;
        let currentQuoteCustomerId = null;
        let currentCategory = '전체';
        let deletingId = null;
        let attachedPhoto = "";
        let unsubscribeFirestore = null;

        // 인증 상태 감시자
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
                if (unsubscribeFirestore) unsubscribeFirestore();
                unsubscribeFirestore = onSnapshot(ref, (snapshot) => {
                    customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    window.render();
                }, (error) => {
                    console.error("Firestore 수신 오류:", error);
                    alert("데이터베이스 권한 오류: 보안 규칙을 확인해주세요.");
                });
            } else {
                currentUser = null;
                customers = [];
                if (unsubscribeFirestore) unsubscribeFirestore();
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        window.loginCRM = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('loginBtn');
            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "접속 중...";
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                errEl.classList.remove('hidden');
                errEl.innerText = "이메일 또는 비밀번호가 올바르지 않습니다.";
            } finally {
                btn.disabled = false;
                btn.innerText = "로그인";
            }
        };

        window.logoutCRM = async function() {
            if (confirm("로그아웃 하시겠습니까?")) await signOut(auth);
        };

        // 키워드 자동 분류
        window.fastKeywordParse = function() {
            const input = document.getElementById('smartInput').value.trim();
            if (!input) return;
            const words = input.split(/\s+/);
            let name = "", phone = "", product = "미지정";
            const pMap = {
                '티비': ['티비', 'TV', 'tv', '올레드', 'oled', 'qled', 'KQ'],
                '냉장고': ['냉장고', '비스포크', '오브제', '김치냉장고', '김냉', 'RF'],
                '에어컨': ['에어컨', '무풍', '시스템에어컨', 'AF'],
                '혼수 가전': ['혼수', '이사', '입주', '전체', '웨딩'],
                '식기세척기': ['식세기', '식기세척기', 'DW'],
                '세탁건조기': ['세탁기', '건조기', '워시타워', '원바디', '세탁건조기', 'WF']
            };
            words.forEach(word => {
                const num = word.replace(/[^0-9]/g, '');
                if (!phone && (num.length >= 7 || word.startsWith('010'))) { phone = word; return; }
                for (const [pk, kws] of Object.entries(pMap)) {
                    if (kws.some(k => word.toLowerCase().includes(k.toLowerCase()))) { product = pk; return; }
                }
                if (!name && /^[가-힣]{2,4}$/.test(word) && !['고객', '견적', '합계', '결제', '체감'].includes(word)) { name = word; }
            });
            if (name) document.getElementById('formName').value = name;
            if (phone) document.getElementById('formPhone').value = phone;
            if (product !== "미지정") document.getElementById('formProduct').value = product;
            document.getElementById('formNotes').value = input;
        };

        window.startVoiceRecognition = function() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return alert("현재 브라우저는 음성 인식을 지원하지 않습니다.");
            const rec = new SpeechRec();
            rec.lang = 'ko-KR';
            const btn = document.getElementById('mic-btn');
            rec.onstart = () => { btn.classList.replace('bg-blue-600', 'bg-red-500'); btn.classList.add('animate-pulse'); };
            rec.onend = () => { btn.classList.replace('bg-red-500', 'bg-blue-600'); btn.classList.remove('animate-pulse'); };
            rec.onresult = (e) => {
                document.getElementById('smartInput').value = e.results[0][0].transcript;
                window.fastKeywordParse();
            };
            rec.start();
        };

        window.handlePhotoSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 600; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    attachedPhoto = canvas.toDataURL('image/jpeg', 0.6);
                    const preview = document.getElementById('photo-preview-img');
                    preview.src = attachedPhoto; 
                    preview.style.display = 'block';
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // 견적 추가 모달 제어
        window.openQuoteModal = (customerId) => {
            const c = customers.find(item => item.id === customerId);
            if (!c) return;
            currentQuoteCustomerId = customerId;
            const quotesCount = (c.quotes || []).length;
            document.getElementById('quoteTargetName').innerText = `${c.name || '고객'} (현재 견적 ${quotesCount}건)`;
            document.getElementById('quoteTitle').value = `${quotesCount + 1}차 견적`;
            document.getElementById('quotePrice').value = "";
            document.getElementById('quoteContent').value = "";
            document.getElementById('quoteModal').classList.remove('hidden');
        };

        window.closeQuoteModal = () => {
            document.getElementById('quoteModal').classList.add('hidden');
            currentQuoteCustomerId = null;
        };

        window.pasteFromClipboard = async () => {
            try {
                const text = await navigator.clipboard.readText();
                if(text) document.getElementById('quoteContent').value = text;
            } catch (err) {
                alert("클립보드 권한이 필요합니다. 텍스트를 직접 길게 눌러 붙여넣어 주세요.");
            }
        };

        window.saveNewQuote = async () => {
            if (!currentUser || !currentQuoteCustomerId) return;
            const c = customers.find(item => item.id === currentQuoteCustomerId);
            if (!c) return;

            const title = document.getElementById('quoteTitle').value.trim() || '추가 견적';
            const price = document.getElementById('quotePrice').value.trim();
            const content = document.getElementById('quoteContent').value.trim();

            if (!content && !price) return alert("체감가 또는 견적서 내용을 입력해주세요.");

            const newQuoteItem = {
                id: 'q-' + Date.now(),
                title: title,
                price: price,
                content: content,
                createdAt: new Date().toISOString()
            };

            const existingQuotes = Array.isArray(c.quotes) ? c.quotes : [];
            const updatedQuotes = [newQuoteItem, ...existingQuotes]; // 최신 견적이 위로

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', currentQuoteCustomerId);
            await setDoc(docRef, { quotes: updatedQuotes, updatedAt: new Date().toISOString() }, { merge: true });

            window.closeQuoteModal();
            window.showToast();
        };

        window.copyQuoteText = (text) => {
            if(!text) return alert("복사할 견적서 내용이 없습니다.");
            navigator.clipboard.writeText(text).then(() => {
                alert("📋 견적서 전문이 복사되었습니다!\n고객 카카오톡이나 문자에 바로 붙여넣기 하세요.");
            });
        };

        // 메인 리스트 렌더링
        window.render = function() {
            const container = document.getElementById('customerList');
            if (!container) return;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortFilter').value;
            
            const quotesTotal = customers.filter(c => Array.isArray(c.quotes) && c.quotes.length > 0).length;
            document.getElementById('stat-견적관리').innerText = quotesTotal;
            document.getElementById('stat-미연락').innerText = customers.filter(c => c.category === '미연락').length;
            document.getElementById('stat-상담진행').innerText = customers.filter(c => c.category === '상담진행').length;
            document.getElementById('stat-urgent').innerText = customers.filter(c => c.isUrgent === true).length;

            let filtered = customers;
            if (currentCategory === '견적관리') {
                filtered = customers.filter(c => Array.isArray(c.quotes) && c.quotes.length > 0);
            } else if (currentCategory === '긴급') {
                filtered = customers.filter(c => c.isUrgent === true);
            } else if (currentCategory !== '전체') {
                filtered = customers.filter(c => c.category === currentCategory);
            }
            
            filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search) || (c.phone || '').includes(search) || (c.product || '').includes(search));

            filtered.sort((a, b) => {
                const aU = a.isUrgent === true ? 0 : 1;
                const bU = b.isUrgent === true ? 0 : 1;
                if (aU !== bU) return aU - bU;
                if (sortMode === 'quotes') {
                    const qA = (a.quotes || []).length;
                    const qB = (b.quotes || []).length;
                    return qB - qA;
                }
                if (sortMode === 'product') return (a.product || '미지정').localeCompare(b.product || '미지정');
                if (sortMode === 'name') return (a.name || '').localeCompare(b.name || '');
                return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
            });

            document.getElementById('totalBadge').innerText = `${filtered.length} 명`;
            container.innerHTML = filtered.length ? '' : '<div class="py-20 text-slate-300 font-bold text-sm text-center">등록된 고객이 없습니다.</div>';

            filtered.forEach(c => {
                const isUrgent = c.isUrgent === true;
                const cOpts = ['상담진행', '미연락', '사은품'].map(cat => `<option value="${cat}" ${c.category === cat ? 'selected' : ''}>${cat}</option>`).join('');
                const dateHtml = c.scheduledDate ? `<span class="bg-orange-50 text-orange-600 px-2 py-0.5 rounded-md font-black mr-2">${c.scheduledDate} 일정</span>` : '';
                const imgHtml = c.photo ? `<img src="${c.photo}" class="card-photo" onclick="window.showFullImage('${c.photo}')">` : '';
                
                // 견적서 이력 렌더링
                const quotesList = Array.isArray(c.quotes) ? c.quotes : [];
                let quotesHtml = '';
                if (quotesList.length > 0) {
                    quotesHtml = `
                        <div class="mt-3 pt-3 border-t border-slate-100 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-black text-purple-700 tracking-wider"><i class="fa-solid fa-file-invoice-dollar mr-1"></i>견적 이력 (${quotesList.length}건)</span>
                                <button onclick="window.openQuoteModal('${c.id}')" class="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-lg active-scale">+ 새 견적</button>
                            </div>
                            <div class="space-y-2">
                                ${quotesList.map((q, idx) => `
                                    <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3 text-left">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="font-black text-xs text-slate-800">${q.title || `${idx+1}차 견적`}</span>
                                            <span class="text-xs font-black text-purple-600">${q.price ? `체감 ${q.price}` : ''}</span>
                                        </div>
                                        <p class="text-[11px] font-mono text-slate-600 whitespace-pre-wrap line-clamp-3 bg-white p-2 rounded-lg border border-slate-100">${q.content || '내용 없음'}</p>
                                        <div class="flex justify-between items-center mt-2 pt-1 border-t border-slate-200/50">
                                            <span class="text-[8px] text-slate-400 font-mono">${new Date(q.createdAt).toLocaleDateString()}</span>
                                            <button onclick="window.copyQuoteText(\`${(q.content || '').replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)" 
                                                class="text-[10px] font-bold text-purple-600 hover:text-purple-800 active-scale flex items-center gap-1">
                                                <i class="fa-regular fa-copy"></i> 카톡 전송용 복사
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    quotesHtml = `
                        <div class="mt-2 text-right">
                            <button onclick="window.openQuoteModal('${c.id}')" class="text-[10px] font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-xl active-scale">
                                <i class="fa-solid fa-plus mr-1"></i>견적서 등록
                            </button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-[32px] border ${isUrgent ? 'urgent-card' : 'border-slate-100'} shadow-sm transition-all">
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-left flex-1 overflow-hidden">
                                <h4 class="font-black text-slate-800 text-lg truncate flex items-center">
                                    ${isUrgent ? '<span class="urgent-tag">긴급</span>' : ''}
                                    ${c.name || '고객'}
                                </h4>
                                <p class="text-[11px] font-bold text-slate-400 font-mono tracking-tight">${c.phone || '연락처 없음'}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="window.toggleUrgent('${c.id}')" class="w-9 h-9 rounded-full flex items-center justify-center shadow-sm transition-all ${isUrgent ? 'bg-red-500 text-white' : 'bg-slate-50 text-slate-300'} active-scale">
                                    <i class="fa-solid fa-bell text-xs"></i>
                                </button>
                                <select onchange="window.fastUpdate('${c.id}', 'category', this.value)" class="category-quick-select">${cOpts}</select>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-3 items-center text-[9px] font-black text-slate-400 uppercase">
                            ${dateHtml}
                            <span class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600 font-bold">${c.product || '미지정'}</span>
                            <span class="ml-auto"><i class="fa-solid fa-clock mr-1"></i> ${c.updatedAt ? new Date(c.updatedAt).toLocaleDateString() : ''}</span>
                        </div>
                        ${imgHtml}
                        
                        <div class="memo-box mb-3">
                            <textarea onblur="window.fastUpdate('${c.id}', 'notes', this.value)" 
                                class="w-full text-xs font-semibold text-slate-600 leading-relaxed bg-transparent border-none outline-none resize-none placeholder-slate-300" 
                                placeholder="상담 메모 작성..." rows="2">${c.notes || ''}</textarea>
                        </div>

                        ${quotesHtml}
                        
                        <div class="flex gap-2 mt-4">
                            <a href="tel:${c.phone}" class="flex-[3] h-11 bg-slate-900 text-white rounded-2xl flex items-center justify-center gap-2 font-black text-xs no-underline shadow-md active-scale"><i class="fa-solid fa-phone text-xs"></i> 통화</a>
                            <a href="sms:${c.phone}" class="flex-[3] h-11 bg-white border border-slate-200 text-slate-800 rounded-2xl flex items-center justify-center gap-2 font-black text-xs no-underline shadow-sm active-scale"><i class="fa-solid fa-message text-xs text-slate-400"></i> 문자</a>
                            
                            <button onclick="window.editCustomer('${c.id}')" class="flex-1 h-11 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center active-scale">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="window.requestDelete('${c.id}')" class="flex-1 h-11 bg-slate-50 text-slate-300 rounded-xl flex items-center justify-center active-scale hover:text-red-500">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        };

        // 고객 저장
        window.saveCustomer = async () => {
            if (!currentUser) return alert("로그인이 필요합니다.");
            const name = document.getElementById('formName').value.trim();
            const phone = document.getElementById('formPhone').value.trim();
            const notes = document.getElementById('formNotes').value.trim();
            
            if (!name && !phone && !notes && !attachedPhoto) return alert("저장할 내용이 최소 하나는 있어야 합니다.");

            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const docId = editingId || (cleanPhone.length >= 7 ? cleanPhone : 'c-' + Date.now());
            
            const payload = {
                name: name || "고객",
                phone: phone || "",
                category: document.getElementById('formCategory').value,
                product: document.getElementById('formProduct').value,
                scheduledDate: document.getElementById('formScheduledDate').value,
                notes: notes,
                photo: attachedPhoto,
                updatedAt: new Date().toISOString()
            };

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', docId);
            await setDoc(docRef, payload, { merge: true });
            
            window.closeModal(); 
            window.showToast();
        };

        window.fastUpdate = async (id, field, value) => {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'customers', id);
            await setDoc(docRef, { [field]: value, updatedAt: new Date().toISOString() }, { merge: true });
            window.showToast();
        };

        window.toggleUrgent = async (id) => {
            const c = customers.find(item => item.id === id);
            if (c) window.fastUpdate(id, 'isUrgent', !(c.isUrgent === true));
        };

        window.requestDelete = (id) => { deletingId = id; document.getElementById('deleteModal').classList.replace('hidden', 'flex'); };
        window.closeDeleteModal = () => { document.getElementById('deleteModal').classList.replace('flex', 'hidden'); deletingId = null; };
        
        document.getElementById('confirmDeleteBtn').onclick = async () => { 
            if (!deletingId || !currentUser) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', deletingId)); 
            window.closeDeleteModal(); 
        };

        window.setCategory = (cat) => { 
            currentCategory = cat; 
            document.body.className = `pb-24 select-none theme-${cat}`; 
            document.querySelectorAll('nav button').forEach(b => b.className = 'flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-inactive'); 
            document.getElementById(`tab-${cat}`).className = 'flex-none px-4 py-4 text-xs tracking-tighter transition-all tab-active'; 
            window.render(); 
        };
        
        window.openModal = () => { 
            document.getElementById('modal').classList.replace('hidden', 'flex'); 
            document.getElementById('smartInputContainer').style.display = editingId ? 'none' : 'block';
        };
        
        window.closeModal = () => { 
            document.getElementById('modal').classList.replace('flex', 'hidden'); 
            editingId = null; 
            attachedPhoto = "";
            ['formName', 'formPhone', 'formNotes', 'formScheduledDate', 'smartInput'].forEach(id => document.getElementById(id).value='');
            document.getElementById('formProduct').value = '미지정';
            document.getElementById('photo-preview-img').style.display = 'none';
        };

        window.editCustomer = (id) => { 
            const c = customers.find(c => c.id === id); 
            if(!c) return; 
            editingId = id; 
            window.openModal(); 
            document.getElementById('formName').value = c.name || ''; 
            document.getElementById('formPhone').value = c.phone || ''; 
            document.getElementById('formProduct').value = c.product || '미지정'; 
            document.getElementById('formScheduledDate').value = c.scheduledDate || ''; 
            document.getElementById('formNotes').value = c.notes || ''; 
            document.getElementById('formCategory').value = c.category || '상담진행';
            if(c.photo) { 
                attachedPhoto = c.photo; 
                document.getElementById('photo-preview-img').src = c.photo; 
                document.getElementById('photo-preview-img').style.display = 'block'; 
            }
        };

        window.showToast = () => { 
            const t = document.getElementById('save-toast'); 
            t.style.display = 'block'; 
            setTimeout(() => { t.style.display = 'none'; }, 2000); 
        };

        window.showFullImage = (src) => { 
            const win = window.open(); 
            win.document.write(`<img src="${src}" style="width:100%;height:auto;">`); 
        };
    </script>
</body>
</html>
